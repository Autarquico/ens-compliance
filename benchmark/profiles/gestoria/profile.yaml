format: ens-benchmark-profile/1
fictional: true
id: gestoria
title: Gestoría Albar S.L., gestoría administrativa de cuatro personas con oficina y servidor propio (ficticia)
clock:
  start: "2026-10-01T09:00:00+00:00"
categorization: {C: BAJO, I: BAJO, T: BAJO, A: BAJO, D: BAJO}
