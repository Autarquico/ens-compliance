    owner: pilar
    review_every_days: 90
    reviewed_by: pilar
    assessment: COMPLIANT
    conclusion: Copia diaria local y externa cifrada, con la prueba de restauración semestral superada en septiembre.
  - measure: op.nub.1
    owner: elena
    review_every_days: 180
    reviewed_by: pilar
    assessment: COMPLIANT
    conclusion: El proveedor de la aplicación de gestión está certificado en el ENS para el servicio contratado.
matrix_defaults:
  owner: raul
  review_every_days: 365
  reviewed_by: pilar
  conclusion: Revisada con la evidencia enlazada, el acta del Comité de Seguridad de septiembre y los documentos aprobados.
