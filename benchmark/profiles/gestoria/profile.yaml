incident_drill:
  alias: simulacro
  by: raul
  title: Simulacro de robo de un portátil en teletrabajo
  action: Se bloquea la cuenta de correo de la persona afectada, se ordena el borrado remoto del portátil desde la consola del proveedor y se cambian sus contraseñas
  conclusion: El aviso llegó al responsable de seguridad en 15 minutos y el borrado remoto se confirmó en una hora; el disco estaba cifrado, por lo que no hubo exposición de expedientes.
  auditable_events_detail: Los registros del correo y de la consola del proveedor ya recogen el bloqueo de la cuenta y la orden de borrado.
  links:
    - {measure: op.exp.9, covers: [base]}
