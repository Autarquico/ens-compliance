format: ens-benchmark-profile/1
fictional: true
id: clinica-dental
title: Clínica Dental Sonrisa Ficticia (pyme ficticia de la partición reservada)
clock:
  start: "2026-10-05T08:30:00+00:00"
categorization: {C: BAJO, I: BAJO, T: BAJO, A: BAJO, D: BAJO}
