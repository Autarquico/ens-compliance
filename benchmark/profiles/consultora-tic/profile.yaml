incident_drill:
  alias: simulacro
  by: tomas
  title: Simulacro de correo fraudulento que pide la contraseña de la identidad corporativa
  action: Se bloquea el remitente en el correo, se fuerza el cierre de sesiones de la cuenta afectada y se comprueba que el doble factor impidió el acceso
  conclusion: El aviso llegó al responsable de seguridad en 20 minutos y el doble factor bloqueó el intento; se añade un ejemplo a la formación anual.
  auditable_events_detail: Los registros de la identidad corporativa ya recogen los intentos de inicio de sesión y los cierres de sesión forzados.
  links:
    - {measure: op.exp.9, covers: [base]}
document_links:
  - {measure: org.1, document: politica-seguridad, covers: [base]}
  - {measure: org.2, document: normativa-seguridad, covers: [base]}
  - {measure: org.3, document: procedimientos-seguridad, covers: [base]}
  - {measure: org.4, document: proceso-autorizacion, covers: [base]}
  - {measure: op.exp.7, document: procedimiento-incidentes, covers: [base]}
matrix:
  - measure: op.acc.6
    owner: nora
    review_every_days: 90
    reviewed_by: nora
    assessment: COMPLIANT
    conclusion: Las tres cuentas nominales usan doble factor y la organización de código lo exige.
  - measure: mp.info.6
    owner: nora
    review_every_days: 90
    reviewed_by: nora
    assessment: COMPLIANT
    conclusion: Copias diarias cifradas en otra región y prueba de restauración del trimestre superada.
matrix_defaults:
  owner: tomas
  review_every_days: 365
  reviewed_by: nora
  conclusion: Revisada con la evidencia enlazada, el acta del Comité de Seguridad de septiembre y los documentos aprobados.
