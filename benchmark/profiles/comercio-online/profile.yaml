incident_drill:
  alias: simulacro
  by: oscar
  title: Simulacro de pedido fraudulento con cambio de dirección de envío
  action: Se retiene el pedido, se bloquea la cuenta del cliente y se avisa a la pasarela de pago
  conclusion: El simulacro confirma que atención al cliente detecta el patrón y avisa al responsable de seguridad antes de preparar el envío.
  auditable_events_detail: El panel ya registra los cambios de dirección de envío y los bloqueos de cuenta.
  links:
    - {measure: op.exp.9, covers: [base]}
document_links:
  - {measure: org.1, document: politica-seguridad, covers: [base]}
  - {measure: org.1, document: designacion-responsables, covers: [base]}
  - {measure: org.2, document: normativa-seguridad, covers: [base]}
