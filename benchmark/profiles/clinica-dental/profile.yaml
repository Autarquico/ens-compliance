  - id: elena
    name: Elena Muela
    roles: [management, information_owner]
  - id: hugo
    name: Hugo Encía
    roles: [service_owner]
applicability:
  - measure: mp.si.2
    applicable: true
    justification: >-
      Seleccionada como adicional: la clínica entrega a pacientes y a otros profesionales discos
      con radiografías, y el análisis de riesgos identifica su pérdida fuera de la clínica.
  - measure: op.pl.5
    applicable: false
    justification: >-
      La clínica no compra productos de seguridad cuya certificación pida el análisis de riesgos:
      el antivirus es un servicio gestionado y el programa de gestión lo aporta un proveedor que
      acredita cada año su conformidad con el ENS. El anexo II no la exige en categoría BÁSICA.
  - measure: op.acc.3
    applicable: false
    justification: >-
      Con ocho personas no hay plantilla para separar funciones; la tarea más sensible, dar o
      quitar permisos en el programa, ya exige la petición firmada de la directora y solo la
      ejecuta el responsable de sistemas. No exigida en categoría BÁSICA.
  - measure: op.exp.5
    applicable: false
    justification: >-
      No hay desarrollo propio ni cambios frecuentes de configuración: los únicos cambios son las
      actualizaciones mensuales del técnico externo, probadas antes en recepción y anotadas en el
      parte de mantenimiento (op.exp.4). La categoría BÁSICA no la exige.
  - measure: op.ext.1
    applicable: false
    justification: >-
      Los proveedores del programa de gestión y del mantenimiento entran con contrato y encargo
      de tratamiento según el proceso de autorización, y el almacenamiento externo de copias es un
      servicio contratado; el análisis de riesgos no señala su incumplimiento como amenaza y la
      caída de las comunicaciones se acepta como riesgo residual. No exigida en BÁSICA.
  - measure: op.ext.2
    applicable: false
    justification: >-
      La relación con los proveedores se reduce a la visita mensual del técnico externo, que
      supervisa el responsable de sistemas, y a los avisos del proveedor del programa que revisa
      el comité; la consola del antivirus y las copias externas las vigila el propio responsable
      de sistemas. BÁSICA no pide más.
  - measure: op.ext.3
    applicable: false
    justification: >-
      El único componente crítico de un tercero es el programa de gestión, cuyo proveedor entrega
      cada año su certificado de conformidad con el ENS, como recoge el acta anual. El análisis de
      riesgos no identifica amenazas en la cadena de suministro; no exigida en BÁSICA.
  - measure: op.ext.4
    applicable: false
    justification: >-
      El sistema no se interconecta con otros: los informes para el servicio de salud se suben a
      mano en su plataforma web por conexión cifrada, sin intercambio automático entre sistemas.
      El anexo II no la exige en categoría BÁSICA.
  - measure: op.cont.1
    applicable: false
    justification: >-
      La disponibilidad se valora en nivel BAJO y el análisis de riesgos ya fija lo que importa:
      recuperar las historias en menos de un día desde la copia nocturna y atender mientras con la
      agenda en papel. No se hace un análisis de impacto aparte, que BÁSICA no pide.
  - measure: op.cont.2
    applicable: false
    justification: >-
      Sin plan de continuidad formal: con disponibilidad BAJA, la restauración del servidor desde
      la copia externa, probada cada trimestre (mp.info.6), y la agenda en papel cubren la parada
      que el análisis de riesgos acepta. No exigida en categoría BÁSICA.
  - measure: op.cont.3
    applicable: false
    justification: >-
      Al no haber plan de continuidad no hay plan que probar; lo que sí se prueba cada trimestre
      es restaurar una historia completa desde la copia externa, dentro de mp.info.6. La medida no
      se exige en BÁSICA.
  - measure: op.cont.4
    applicable: false
    justification: >-
      No se mantienen medios alternativos de tratamiento: si caen el servidor o las
      comunicaciones, la clínica atiende con agenda en papel y teléfono, riesgo residual aceptado
      en el análisis de riesgos. El anexo II no la exige en BÁSICA.
  - measure: mp.if.6
    applicable: false
    justification: >-
      El cuarto técnico de la planta baja no tiene conducciones de agua y el análisis de riesgos
      no cuenta la inundación entre las amenazas del servidor. Medida no exigida en categoría
      BÁSICA.
  - measure: mp.per.1
    applicable: false
    justification: >-
      Los puestos ya están definidos por perfil en el programa de gestión (odontólogos,
      higienista, recepción y administración) y se revisan cada trimestre con op.acc.4; no se
      redacta una caracterización de puestos aparte, que BÁSICA no exige.
  - measure: mp.eq.2
    applicable: false
    justification: >-
      No se configura el bloqueo automático por inactividad: la normativa obliga a bloquear la
      sesión al levantarse del puesto y la pantalla de recepción no mira a la sala de espera. No
      es exigible en categoría BÁSICA.
  - measure: mp.com.4
    applicable: false
    justification: >-
      La única separación que necesita la red, la wifi de pacientes frente a la red de gabinetes,
      ya la hace el router como parte de la protección perimetral (mp.com.1); no hay otros flujos
      que segregar. No exigida en BÁSICA.
  - measure: mp.si.1
    applicable: false
    justification: >-
      No se adopta un esquema de marcado: el único soporte que sale de la clínica, el disco de
      radiografías, ya lleva etiqueta y se anota en el registro de soportes según los
      procedimientos aprobados. No exigida en categoría BÁSICA.
  - measure: mp.sw.1
    applicable: false
    justification: >-
      La clínica no desarrolla aplicaciones: usa el programa de gestión y el software de
      radiografía de sus proveedores, autorizados en el proceso de autorización. Sin desarrollo
      propio la medida no procede y BÁSICA tampoco la exige.
  - measure: mp.info.2
    applicable: false
    justification: >-
      Toda la información del sistema se trata con el cuidado que pide la más sensible, la
      historia clínica, así que no hace falta calificarla por niveles. El anexo II no la exige en
      categoría BÁSICA.
  - measure: mp.info.4
    applicable: false
    justification: >-
      Ningún proceso necesita sellos de tiempo: la directora firma los informes desde su portátil
      y el programa guarda la fecha y el autor de cada anotación en la historia. No exigida en
      BÁSICA.
  - measure: mp.s.4
    applicable: false
    justification: >-
      Desde fuera solo es accesible el acceso remoto de la directora, con doble factor; los
      pacientes piden cita por teléfono o en el mostrador. Una interrupción de horas se atiende
      con la agenda en papel, riesgo que el análisis acepta. No exigida en BÁSICA.
