incident_drill:
  alias: simulacro
  by: irene
  title: Simulacro de llamada que suplanta al proveedor del programa de gestión
  action: Se cuelga la llamada, se cambia la contraseña del usuario afectado y se avisa al proveedor por su canal oficial
  conclusion: El simulacro confirma que recepción reconoce la suplantación y avisa a la responsable de seguridad en menos de una hora.
  auditable_events_detail: El registro de accesos del programa ya recoge los cambios de contraseña y los inicios de sesión fallidos.
  links:
