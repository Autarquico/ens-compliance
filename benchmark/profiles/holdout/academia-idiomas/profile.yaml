format: ens-benchmark-profile/1
fictional: true
id: academia-idiomas
title: Academia de idiomas con matrícula en línea, correcta y completa en categoría BÁSICA
clock:
  start: 2026-10-05T09:00:00+00:00
categorization:
  C: BAJO
  I: BAJO
  T: BAJO
  A: BAJO
  D: BAJO
people:
  - id: marta-quiros
    name: Marta Quirós Vidal
    roles: [management, information_owner, service_owner]
  - id: inigo-paredes
    name: Íñigo Paredes Lasa
    roles: [security_officer]
  - id: lucia-barrios
    name: Lucía Barrios Soto
    roles: [system_owner, system_administrator]
applicability:
  - measure: mp.eq.2
    applicable: true
    justification: La academia adopta de forma voluntaria el bloqueo por inactividad porque los portátiles con datos de alumnado salen de la oficina y el análisis de riesgos identifica su pérdida como amenaza probable.
  - measure: mp.if.6
    applicable: true
    justification: La academia adopta de forma voluntaria la protección frente al agua del armario del router por estar el local en planta baja junto a un aseo, aunque el anexo II no la exige para el nivel BAJO de disponibilidad.
  - measure: mp.s.4
    applicable: true
    justification: La academia adopta de forma voluntaria la protección frente a la denegación de servicio porque la matrícula en línea concentra la carga en pocos días y el análisis de riesgos identifica su caída como amenaza probable.
reinforcements:
  op.acc.5: [R1]
  op.acc.6: [R2]
  mp.s.2: [R1]
not_required_justification: >-
  La tabla del anexo II del RD 311/2022 no exige esta medida para la categoría BÁSICA ni
  para el nivel BAJO de las dimensiones afectadas, y la academia no la adopta de forma voluntaria.
