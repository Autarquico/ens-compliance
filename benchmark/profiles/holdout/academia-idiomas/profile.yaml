incident_drill:
  alias: simulacro
  by: lucia-barrios
  title: Simulacro de pérdida de un portátil fuera de la oficina
  action: Se bloquean las cuentas de la persona afectada, se cierran sus sesiones y se cambian sus credenciales.
  conclusion: El simulacro se resolvió en menos de una hora; se confirma que el procedimiento de pérdida de portátiles funciona.
  auditable_events_detail: Se revisó la lista de eventos auditables y no se necesitan cambios tras el simulacro.
  links:
    - measure: op.exp.9
      covers: [op.exp.9.1, op.exp.9.2, op.exp.9.3]
