format: ens-benchmark-profile/1
fictional: true
id: agencia-viajes
title: Agencia de viajes con servidor de archivos y reservas contratadas como servicio, correcta y completa en categoría BÁSICA
clock:
  start: 2026-10-12T08:30:00+00:00
categorization:
  C: BAJO
  I: BAJO
  T: BAJO
  A: BAJO
  D: BAJO
people:
  - id: rafael-ortuno
    name: Rafael Ortuño Cabello
    roles: [management, information_owner, service_owner]
  - id: noelia-salvatierra
    name: Noelia Salvatierra Mena
    roles: [security_officer]
  - id: gonzalo-iglesias
    name: Gonzalo Iglesias Pardo
    roles: [system_owner, system_administrator]
applicability:
  - measure: op.cont.1
    applicable: true
    justification: La agencia adopta de forma voluntaria el análisis de impacto porque la venta depende del programa de reservas y necesita saber cuánto tiempo de interrupción tolera en temporada alta, aunque el anexo II no lo exige para el nivel BAJO de disponibilidad.
  - measure: mp.per.1
    applicable: true
    justification: La agencia adopta de forma voluntaria la caracterización de los puestos porque con solo cinco personas cada puesto maneja datos de viajeros y conviene dejar escritas las responsabilidades de cada uno.
  - measure: mp.eq.2
    applicable: true
    justification: La agencia adopta de forma voluntaria el bloqueo por inactividad porque los portátiles con datos de viajeros quedan en el mostrador a la vista del público.
reinforcements:
  op.acc.5: [R2]
  op.acc.6: [R2]
  mp.s.2: [R1]
not_required_justification: >-
  La tabla del anexo II del RD 311/2022 no exige esta medida para la categoría BÁSICA ni
  para el nivel BAJO de las dimensiones afectadas, y la agencia no la adopta de forma voluntaria.
documents:
  - {ref: politica-seguridad, approved_by: rafael-ortuno}
  - {ref: normativa-seguridad, approved_by: rafael-ortuno}
  - {ref: designacion-responsables, approved_by: rafael-ortuno}
