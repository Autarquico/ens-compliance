incident_drill:
  alias: simulacro
  by: gonzalo-iglesias
  title: Simulacro de fallo del servidor de archivos
  action: Se aísla el servidor de la red, se arranca la restauración desde la copia nocturna y se informa al mostrador de que los expedientes no están disponibles.
  conclusion: El simulacro permitió restaurar una carpeta de prueba en menos de dos horas y confirmó que el procedimiento de recuperación funciona.
  auditable_events_detail: Se revisó la lista de eventos auditables y no se necesitan cambios tras el simulacro.
  links:
    - measure: op.exp.9
      covers: [op.exp.9.1, op.exp.9.2, op.exp.9.3]
