format: ens-benchmark-case/1
id: comercio-escaneo-secretos-apagado
partition: dev
profile: comercio-online
kind: defective
mutations:
  - op: collected_override
    alias: github
    file: github.json
defects:
  - id: escaneo-secretos-desactivado
    layer: deterministic
    measure: op.exp.10
    target: {kind: none}
    expected_rule: CHECK_FAIL
    requirement:
      measure: op.exp.10
      clause: op.exp.10.1
      quote: Las claves criptográficas se protegerán durante todo su ciclo de vida
    rationale: >-
      La recogida del 3 de octubre muestra el escaneo de secretos desactivado en el repositorio
      de la tienda, aunque la matriz lo daba por activo. Lo cubre el check de secret scanning;
      un hallazgo de juicio sobre lo mismo sería una falsa alarma.
