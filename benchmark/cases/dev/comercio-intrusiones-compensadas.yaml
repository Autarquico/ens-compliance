format: ens-benchmark-case/1
id: comercio-intrusiones-compensadas
partition: dev
profile: comercio-online
kind: defective
mutations:
  - op: compensate
    measure: op.mon.1
    measures: [Confiar en que el alojamiento avise si ve algo raro]
    replaces: [base]
    justification: >-
      Somos un taller pequeño y nunca nos han atacado; si alguien lo intentara, ya nos avisaría
      el proveedor de alojamiento.
defects:
  - id: deteccion-sustituida-por-confianza
    layer: judgment
    measure: op.mon.1
    target: {kind: justification}
    expected_criterion: solidez-justificacion-aplicabilidad
    requirement:
      measure: op.mon.1
      clause: op.mon.1.1
      quote: Se dispondrá de herramientas de detección o prevención de intrusiones.
    rationale: >-
      Esperar un aviso del proveedor no es una herramienta de detección, y la propia evidencia
      de vigilancia registra cientos de intentos de acceso bloqueados cada mes en la tienda.
  - id: vigilancia-compensada-sin-evidencia
    layer: deterministic
    measure: op.mon.1
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: op.mon.1
      clause: op.mon.1.1
      quote: >-
        Se dispondrá de herramientas de detección o prevención de intrusiones.
    rationale: >-
      El informe de vigilancia cubría la obligación base, que la compensación retira; la medida
      queda sin evidencia que cubra su nueva forma.
