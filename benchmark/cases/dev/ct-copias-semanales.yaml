format: ens-benchmark-case/1
id: ct-copias-semanales
partition: dev
profile: consultora-tic
kind: defective
mutations:
  - op: replace_evidence_text
    alias: copias
    file: copias.txt
defects:
  - id: copias-contradicen-procedimiento
    layer: judgment
    measure: mp.info.6
    target: {kind: evidence, alias: copias}
    expected_criterion: coherencia-politica-evidencia
    requirement:
      measure: mp.info.6
      clause: mp.info.6.1
      quote: La periodicidad y los plazos de retención de estas copias de seguridad se determinarán en la normativa interna de la organización relativa a copias de seguridad.
    rationale: >-
      Los procedimientos fijan copia diaria, retención de 30 diarias y 12 mensuales en otra región
      y prueba trimestral; el informe muestra copias semanales, 4 semanas de retención en la misma
      región del servidor y ninguna prueba de restauración en el año.
