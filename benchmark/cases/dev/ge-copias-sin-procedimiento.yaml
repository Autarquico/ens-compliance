format: ens-benchmark-case/1
id: ge-copias-sin-procedimiento
partition: dev
profile: gestoria
kind: defective
mutations:
  - op: set_answer
    key: info_copias.0.pasos
    value: Se hacen copias cuando hay tiempo.
defects:
  - id: respaldo-sin-frecuencia
    layer: judgment
    measure: mp.info.6
    target: {kind: document, ref: procedimientos-seguridad}
    expected_criterion: calidad-documental
    requirement:
      measure: mp.info.6
      clause: mp.info.6.2
      quote: >-
        Los procedimientos de respaldo establecidos indicarán: a) Frecuencia de las copias.
    rationale: >-
      El mismo apartado documenta el procedimiento de respaldo de mp.info.6, y «cuando hay tiempo»
      no indica la frecuencia de las copias. La misma frase deja sin precisar también el destino, la
      retención y las pruebas de las copias (org.3.4); es el mismo hecho y no se declara aparte.
