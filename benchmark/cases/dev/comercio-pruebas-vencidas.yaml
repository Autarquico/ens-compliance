format: ens-benchmark-case/1
id: comercio-pruebas-vencidas
partition: dev
profile: comercio-online
kind: defective
mutations:
  - op: expire_evidence
    alias: pruebas-despliegue
    valid_until: "2026-10-01T00:00:00+00:00"
defects:
  - id: historial-despliegues-vencido
    layer: deterministic
    measure: mp.sw.2
    target: {kind: evidence, alias: pruebas-despliegue}
    expected_rule: EVIDENCE_EXPIRED
    requirement:
      measure: mp.sw.2
      clause: mp.sw.2
      quote: Antes de pasar a producción se comprobará el correcto funcionamiento de la aplicación.
    rationale: >-
      El historial de despliegues de septiembre con sus pruebas dejó de estar vigente el 1 de
      octubre: no cubre lo publicado en la tienda desde entonces.
  - id: paso-a-produccion-sin-cobertura
    layer: deterministic
    measure: mp.sw.2
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.sw.2
      clause: mp.sw.2.1
      quote: >-
        Se comprobará que: a) Se cumplen los criterios de aceptación en materia de seguridad. b)
        No se deteriora la seguridad de otros componentes del servicio.
    rationale: >-
      El historial vencido era lo único enlazado a la aceptación de la aplicación; la medida
      queda sin evidencia en vigor para sus comprobaciones de seguridad.
