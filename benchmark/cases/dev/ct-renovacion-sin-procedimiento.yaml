format: ens-benchmark-case/1
id: ct-renovacion-sin-procedimiento
partition: dev
profile: consultora-tic
kind: defective
mutations:
  - op: set_answer
    key: renovacion_procedimiento
    value: Los nombramientos no caducan; si algún día hace falta cambiar a alguien, la gerente lo decidirá en ese momento.
defects:
  - id: renovacion-indefinida
    layer: judgment
    measure: org.1
    target: {kind: document, ref: politica-seguridad}
    expected_criterion: calidad-documental
    requirement:
      measure: org.1
      clause: org.1.3
      quote: así como el procedimiento para su designación y renovación
    rationale: >-
      La política deja la renovación de los responsables a una decisión futura sin plazo, sin
      causa ni forma: no precisa el procedimiento de renovación que exige org.1.3.
  - id: renovacion-indefinida-en-designacion
    layer: judgment
    measure: org.1
    target: {kind: document, ref: designacion-responsables}
    expected_criterion: calidad-documental
    requirement:
      measure: org.1
      clause: org.1.3
      quote: así como el procedimiento para su designación y renovación
    rationale: >-
      Del mismo hecho que renovacion-indefinida: la misma respuesta se renderiza también en la
      designación de responsables, que deja la renovación a una decisión futura sin plazo, causa ni
      forma. Se puntúa aparte porque el auditor lo emite como hallazgo propio sobre ese documento.
