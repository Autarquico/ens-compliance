format: ens-benchmark-case/1
id: comercio-formacion-sin-enlace
partition: dev
profile: comercio-online
kind: defective
mutations:
  - op: unlink_evidence
    alias: formacion
    measure: mp.per.4
defects:
  - id: mp-per-4-sin-registro
    layer: deterministic
    measure: mp.per.4
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.per.4
      clause: mp.per.4.1
      quote: >-
        Se formará regularmente al personal en aquellas materias relativas a seguridad de la
        información que requiera el desempeño de sus funciones, en particular en lo relativo a:
        a) Configuración de sistemas. b) Detección y reacción ante incidentes. c) Gestión de la
        información en cualquier soporte en el que se encuentre. Se cubrirán al menos las
        siguientes actividades: almacenamiento, transferencia, copias, distribución y
        destrucción.
    rationale: >-
      Sin el registro de la sesión de septiembre, la formación del equipo de la tienda no tiene
      ninguna evidencia enlazada.
