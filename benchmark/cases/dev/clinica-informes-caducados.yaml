format: ens-benchmark-case/1
id: clinica-informes-caducados
partition: dev
profile: clinica-dental
kind: defective
mutations:
  - op: expire_evidence
    alias: copias
    valid_until: "2026-10-03T00:00:00+00:00"
  - op: expire_evidence
    alias: antivirus
    valid_until: "2026-10-01T00:00:00+00:00"
defects:
  - id: copias-vencidas
    layer: deterministic
    measure: mp.info.6
    target: {kind: evidence, alias: copias}
    expected_rule: EVIDENCE_EXPIRED
    requirement:
      measure: mp.info.6
      clause: mp.info.6.1
      quote: >-
        Se realizarán copias de seguridad que permitan recuperar datos perdidos, accidental o
        intencionadamente.
    rationale: >-
      El único informe de copias aportado para la base de pacientes, el de la última semana de
      septiembre, perdió su vigencia el 3 de octubre; no acredita que hoy se copien las historias.
  - id: antivirus-vencido
    layer: deterministic
    measure: op.exp.6
    target: {kind: evidence, alias: antivirus}
    expected_rule: EVIDENCE_EXPIRED
    requirement:
      measure: op.exp.6
      clause: op.exp.6.4
      quote: Las bases de datos de detección de código dañino permanecerán permanentemente actualizadas.
    rationale: >-
      El informe de la consola del antivirus, exportado el 30 de septiembre, valía hasta el 1 de
      octubre; pasado ese día no prueba que las firmas sigan al día en los seis equipos.
  - id: copias-sin-cobertura
    layer: deterministic
    measure: mp.info.6
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.info.6
      clause: mp.info.6.2
      quote: >-
        Los procedimientos de respaldo establecidos indicarán: a) Frecuencia de las copias. b)
        Requisitos de almacenamiento en el propio lugar. c) Requisitos de almacenamiento en
        otros lugares. d) Controles para el acceso autorizado a las copias de respaldo.
    rationale: >-
      Con el informe de copias caducado, ninguna evidencia vigente cubre ya los requisitos de
      respaldo de la base de pacientes: la medida se queda sin cobertura.
  - id: antivirus-sin-cobertura
    layer: deterministic
    measure: op.exp.6
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: op.exp.6
      clause: op.exp.6.1
      quote: >-
        Se dispondrá de mecanismos de prevención y reacción frente a código dañino, incluyendo
        el correspondiente mantenimiento de acuerdo a las recomendaciones del fabricante.
    rationale: >-
      La protección frente a código dañino solo se respaldaba con el informe de la consola; al
      caducar, ninguna de sus cláusulas tiene una evidencia en vigor.
