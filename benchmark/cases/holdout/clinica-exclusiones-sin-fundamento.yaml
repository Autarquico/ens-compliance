format: ens-benchmark-case/1
id: clinica-exclusiones-sin-fundamento
partition: holdout
profile: clinica-dental
kind: defective
mutations:
  - op: declare_not_applicable
    measure: mp.si.2
    justification: >-
      Los discos con radiografías se los lleva el paciente; desde que salen por la puerta ya no
      son responsabilidad de la clínica.
  - op: compensate
    measure: mp.per.4
    measures: [Entrega del manual de uso del programa de citas al incorporarse]
    replaces: [base]
    justification: >-
      El personal ya sabe manejar el ordenador y el programa de citas; con el manual del
      programa basta y formarlo en seguridad sería perder horas de consulta.
defects:
  - id: soportes-cifrados-excluidos
    layer: judgment
    measure: mp.si.2
    target: {kind: justification}
    expected_criterion: solidez-justificacion-aplicabilidad
    requirement:
      measure: mp.si.2
      clause: mp.si.2.1
      quote: >-
        Se usarán mecanismos criptográficos que garanticen la confidencialidad y la integridad de
        la información contenida.
    rationale: >-
      La clínica eligió esta medida porque sus discos de radiografías salen del local; excluirla
      porque «ya no son responsabilidad» contradice ese motivo y el análisis de riesgos, que
      identifica precisamente su pérdida fuera de la clínica.
  - id: manual-del-programa-por-formacion
    layer: judgment
    measure: mp.per.4
    target: {kind: justification}
    expected_criterion: solidez-justificacion-aplicabilidad
    requirement:
      measure: mp.per.4
      clause: mp.per.4.1
      quote: >-
        Se formará regularmente al personal en aquellas materias relativas a seguridad de la
        información que requiera el desempeño de sus funciones
    rationale: >-
      Un manual de uso del programa no enseña a detectar incidentes ni a tratar datos de salud,
      y el coste en horas de consulta no prueba que la alternativa proteja igual.
  - id: formacion-compensada-sin-evidencia
    layer: deterministic
    measure: mp.per.4
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.per.4
      clause: mp.per.4.1
      quote: "b) Detección y reacción ante incidentes."
    rationale: >-
      La compensación sustituye la obligación base y el registro de formación enlazado no la
      cubre: ninguna evidencia respalda la medida tal como queda declarada.
