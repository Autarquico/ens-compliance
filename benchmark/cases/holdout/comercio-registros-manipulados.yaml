format: ens-benchmark-case/1
id: comercio-registros-manipulados
partition: holdout
profile: comercio-online
kind: defective
judgment: false
mutations:
  - op: tamper_artifact
    alias: registro-actividad
defects:
  - id: configuracion-registros-retocada
    layer: deterministic
    measure: op.exp.8
    target: {kind: evidence, alias: registro-actividad}
    expected_rule: HASH_MISMATCH
    requirement:
      measure: op.exp.8
      clause: op.exp.8.2
      quote: Se activarán los registros de actividad en los servidores.
    rationale: >-
      El fichero con la configuración de los registros del servidor cambió tras su importación;
      lo guardado no es lo que se aportó y su huella lo delata.
  - id: auditoria-sin-evidencia-integra
    layer: deterministic
    measure: op.exp.8
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: op.exp.8
      clause: op.exp.8.1
      quote: Se generará un registro de auditoría
    rationale: >-
      Sin la configuración de registros íntegra, la medida de registro de actividad de la
      tienda no tiene ninguna otra evidencia que la cubra.
