format: ens-benchmark-case/1
id: comercio-exclusiones-de-tienda-web
partition: holdout
profile: comercio-online
kind: defective
mutations:
  - op: compensate
    measure: mp.s.2
    measures: [Protección del sitio web incluida en el plan del proveedor de alojamiento]
    replaces: [base]
    justification: >-
      La tienda está en un alojamiento contratado; la seguridad de la web es cosa del proveedor y
      no nuestra.
  - op: declare_not_applicable
    measure: op.ext.1
    justification: >-
      Nuestros proveedores son empresas grandes y saben lo que hacen; no hace falta pactar con
      ellos ningún nivel de servicio.
defects:
  - id: aplicacion-propia-delegada-al-alojamiento
    layer: judgment
    measure: mp.s.2
    target: {kind: justification}
    expected_criterion: solidez-justificacion-aplicabilidad
    requirement:
      measure: mp.s.2
      clause: mp.s.2.2
      quote: >-
        Se prevendrán intentos de escalado de privilegios.
    rationale: >-
      La empresa desarrolla y despliega el código de su tienda; el alojamiento no protege la
      aplicación frente a escalado de privilegios ni inyección, así que la compensación no
      ofrece una protección equivalente.
  - id: web-compensada-sin-evidencia
    layer: deterministic
    measure: mp.s.2
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.s.2
      clause: mp.s.2.3
      quote: Se prevendrán ataques de cross site scripting.
    rationale: >-
      Con la compensación declarada, el acta anual enlazada solo cubre la obligación retirada y
      la medida web queda sin evidencia para lo que la sustituye.
  - id: acuerdos-de-servicio-excluidos
    layer: judgment
    measure: op.ext.1
    target: {kind: justification}
    expected_criterion: solidez-justificacion-aplicabilidad
    requirement:
      measure: op.ext.1
      clause: op.ext.1.1
      quote: >-
        Con anterioridad a la efectiva utilización de los recursos externos se establecerá
        contractualmente un Acuerdo de Nivel de Servicio, que incluirá las características del
        servicio prestado, lo que debe entenderse como «servicio mínimo admisible», así como, la
        responsabilidad del prestador y las consecuencias de eventuales incumplimientos.
    rationale: >-
      La tienda seleccionó la medida por su dependencia de alojamiento, pasarela y copias; el
      tamaño del proveedor no sustituye a un acuerdo con servicio mínimo y consecuencias, y los
      contratos aportados demuestran que sí existen.
