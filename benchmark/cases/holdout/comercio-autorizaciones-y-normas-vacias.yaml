format: ens-benchmark-case/1
id: comercio-autorizaciones-y-normas-vacias
partition: holdout
profile: comercio-online
kind: defective
mutations:
  - op: set_answer
    key: aut_terceros.0.quien
    value: Quien lo contrate
  - op: set_answer
    key: aut_terceros.0.solicitud
    value: Se aceptan las condiciones en la web del proveedor
  - op: set_answer
    key: aut_terceros.0.registro
    value: No se guarda
  - op: set_answer
    key: uso_indebido
    value: [Lo que el sentido común diga que está mal.]
defects:
  - id: terceros-sin-autorizacion
    layer: judgment
    measure: org.4
    target: {kind: document, ref: proceso-autorizacion}
    expected_criterion: calidad-documental
    requirement:
      measure: org.4
      clause: org.4.8
      quote: Utilización de servicios de terceros, bajo contrato o convenio, concesión, encargo, etc.
    rationale: >-
      Para alojamiento, pasarela de pago y copias, el proceso de autorización deja la decisión a
      quien contrate, sin solicitud ni registro: no es un proceso formal de autorización.
  - id: uso-indebido-sin-concretar
    layer: judgment
    measure: org.2
    target: {kind: document, ref: normativa-seguridad}
    expected_criterion: calidad-documental
    requirement:
      measure: org.2
      clause: org.2.1
      quote: >-
        El uso correcto de equipos, servicios e instalaciones, así como lo que se considerará
        uso indebido.
    rationale: >-
      La normativa define el uso indebido apelando al sentido común, sin ningún ejemplo ni
      límite concreto: el equipo no puede saber qué conducta está prohibida.
