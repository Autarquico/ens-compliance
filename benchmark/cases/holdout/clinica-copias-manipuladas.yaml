format: ens-benchmark-case/1
id: clinica-copias-manipuladas
partition: holdout
profile: clinica-dental
kind: defective
judgment: false
mutations:
  - op: tamper_artifact
    alias: copias
defects:
  - id: copias-retocadas
    layer: deterministic
    measure: mp.info.6
    target: {kind: evidence, alias: copias}
    expected_rule: HASH_MISMATCH
    requirement:
      measure: mp.info.6
      clause: mp.info.6.2
      quote: >-
        Los procedimientos de respaldo establecidos indicarán: a) Frecuencia de las copias. b)
        Requisitos de almacenamiento en el propio lugar. c) Requisitos de almacenamiento en
        otros lugares. d) Controles para el acceso autorizado a las copias de respaldo.
    rationale: >-
      Alguien editó a mano el informe semanal de copias después de importarlo; su huella ya no
      coincide con la registrada y no se puede dar por el documento que se aportó.
  - id: respaldo-sin-evidencia-integra
    layer: deterministic
    measure: mp.info.6
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.info.6
      clause: mp.info.6.1
      quote: >-
        Se realizarán copias de seguridad que permitan recuperar datos perdidos, accidental o
        intencionadamente. La periodicidad y los plazos de retención de estas copias de
        seguridad se determinarán en la normativa interna de la organización relativa a copias
        de seguridad.
    rationale: >-
      Descartado el informe alterado, la medida de copias de la clínica no conserva ninguna
      evidencia íntegra que cubra sus cláusulas.
