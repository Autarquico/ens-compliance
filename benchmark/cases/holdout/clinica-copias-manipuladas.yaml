format: ens-benchmark-case/1
id: clinica-copias-manipuladas
partition: holdout
profile: clinica-dental
kind: defective
judgment: false
mutations:
  - op: tamper_artifact
    alias: copias
defects:
  - id: copias-retocadas
    layer: deterministic
    measure: mp.info.6
    target: {kind: evidence, alias: copias}
    expected_rule: HASH_MISMATCH
    requirement:
      measure: mp.info.6
      clause: mp.info.6.2
      quote: "Los procedimientos de respaldo establecidos indicarán:"
    rationale: >-
      Alguien editó a mano el informe semanal de copias después de importarlo; su huella ya no
      coincide con la registrada y no se puede dar por el documento que se aportó.
  - id: respaldo-sin-evidencia-integra
    layer: deterministic
    measure: mp.info.6
    target: {kind: none}
    expected_rule: EVIDENCE_MISSING
    requirement:
      measure: mp.info.6
      clause: mp.info.6.1
      quote: La periodicidad y los plazos de retención de estas copias de seguridad
    rationale: >-
      Descartado el informe alterado, la medida de copias de la clínica no conserva ninguna
      evidencia íntegra que cubra sus cláusulas.
