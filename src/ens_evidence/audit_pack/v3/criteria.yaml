# Criterios de la capa de juicio. Cada criterio cita su fuente literal, la que dice qué se
# compara; la cita debe aparecer en el texto oficial (tests/preaudit/test_pack.py lo comprueba
# contra los fixtures). La fuente de la clase propuesta (ITS §VI.2, IC-01/19 §53) no va aquí: va
# en `classifications` del mensaje de usuario y en cada hallazgo, según la propuesta.
# `allowed_proposals`: lo único que el modelo puede proponer con este criterio. Nunca un dictamen.
# `measure_scope`: `applicable` (cita documentos y evidencias enlazados a la medida) o
# `not_applicable_or_compensated` (cita la justificación de la medida en `justifications`).
criteria:
  - id: coherencia-politica-evidencia
    text: >-
      La política y la normativa de seguridad declaradas son coherentes con lo que muestran
      las evidencias de las medidas enlazadas: lo que el documento afirma o exige no se
      contradice con lo observado.
    compare: >-
      Las afirmaciones y exigencias de los documentos de política o normativa frente a las
      evidencias enlazadas a la misma medida.
    measure_scope: applicable
    allowed_proposals: [NC_MENOR, OBSERVACION]
    source:
      document: ic0119
      reference: "CCN-CERT IC-01/19, apartado 53"
      quote: "se aprecian incoherencias entre requisitos que deberían estar alineados"
  - id: calidad-documental
    text: >-
      El documento que debe respaldar la medida precisa de forma clara los extremos que el
      anexo II exige que contenga; no basta con que exista.
    compare: >-
      El contenido del documento frente a las cláusulas del anexo II de la medida enlazada que
      dicen qué debe recoger un documento o procedimiento («se precise», «describan»,
      «indicarán», «detallando», «precisando», «cubra», «tendrá en cuenta lo dispuesto»; por
      ejemplo, org.1.1 a org.1.5 para la política de seguridad). Una cláusula que manda hacer algo («se comprobará», «se revisará»,
      «deberán conocer y aceptar») no es un extremo del documento: que el documento no lo
      describa no es un hallazgo de este criterio.
    measure_scope: applicable
    allowed_proposals: [NC_MENOR, OBSERVACION]
    source:
      document: rd311
      reference: "RD 311/2022, anexo II, apartado 3.1 [org.1]"
      quote: "se plasmará en un documento en el que, de forma clara, se precise, al menos, lo siguiente"
  - id: solidez-justificacion-aplicabilidad
    text: >-
      Una medida declarada no aplicable, o sustituida por una compensatoria, está justificada
      documentalmente y la justificación es suficiente para el riesgo sobre los activos.
    compare: >-
      La justificación de aplicabilidad o de compensación frente a los activos, los riesgos y
      la medida del anexo II que se sustituye. Es débil si no da una razón propia de la medida
      o si lo que afirma lo contradicen los activos, los riesgos u otros documentos del
      expediente. Una compensación es débil, además, si no justifica que la medida
      compensatoria protege, igual o mejor, del riesgo sobre los activos que la medida que
      sustituye.
    measure_scope: not_applicable_or_compensated
    allowed_proposals: [NC_MENOR, OBSERVACION]
    source:
      document: rd311
      reference: "RD 311/2022, artículo 28, apartado 3"
      quote: "se justifique documentalmente que protegen, igual o mejor, del riesgo sobre los activos"
