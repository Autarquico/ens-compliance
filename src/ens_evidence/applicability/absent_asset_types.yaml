# Medidas que el anexo II puede exigir y que quedan sin objeto si no existe el tipo de activo
# al que se refieren (anexo II, 2.1.a). Es una decisión del producto, no texto legal: el
# catálogo se extrae del BOE (ADR 0007) y no se toca. Ver ADR 0009.
# Tampoco mp.si.*: custodia (mp.si.3.1), cifrado de copias (mp.si.2.r2.1) y transporte de
# dispositivos (mp.si.4) cubren soportes y copias que no son removibles; ni mp.info.3.
# Nunca entran org.*, op.pl.*, op.exp.*, op.cont.*, op.mon.* ni mp.per.*: son marco o proceso,
# no activos que puedan faltar. Para esas, aplícalas o compénsalas (art. 28.3).
