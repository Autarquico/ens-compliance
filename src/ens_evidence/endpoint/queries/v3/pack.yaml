# Paquete de consultas osquery de la evidencia de endpoints.
# Las tablas y columnas no marcadas con verified: true no se han contrastado
# con las versiones de osquery en uso (https://osquery.io/schema/); el check
# que las consuma debe dar UNKNOWN ante error, tabla vacía o columna ausente.
id: endpoint-queries
version: 3
queries:
  - id: system_info
    platforms: [darwin, linux, windows]
    purpose: HOST-001
    verified: false
    note: Identidad del host (hostname, uuid).
  - id: os_version
    platforms: [darwin, linux, windows]
    purpose: HOST-003
    verified: false
    note: Nombre, versión y build del sistema operativo.
  - id: osquery_info
    platforms: [darwin, linux, windows]
    purpose: HOST-005
    verified: false
    note: Versión de osquery; alf en macOS 15 exige osquery 5.14.1 o superior.
  - id: root_mount
    platforms: [darwin, linux]
    purpose: HOST-004
    verified: false
    note: Dispositivo montado en la raíz; se une con disk_encryption.
  - id: disk_encryption
    platforms: [linux]
    purpose: HOST-004
    verified: false
    note: Puede requerir privilegios; sin filas el check da UNKNOWN.
  - id: disk_encryption_darwin
    platforms: [darwin]
    purpose: HOST-004
    verified: false
    note: >-
      Como disk_encryption más la columna filevault_status, que solo existe en
      macOS y no se ha contrastado con la versión de osquery en uso; si falla,
      el check da UNKNOWN.
  - id: alf
    platforms: [darwin]
    purpose: HOST-005
    verified: false
    note: Firewall de aplicación de macOS; global_state 1 o 2 es activo.
  - id: software_update_policy
    platforms: [darwin]
    purpose: HOST-006
    verified: false
    note: >-
      Preferencias gestionadas (perfil) del dominio com.apple.SoftwareUpdate;
      sin perfil la tabla está vacía y el check da UNKNOWN.
  - id: apps
    platforms: [darwin]
    purpose: HOST-007
    verified: false
    note: Aplicaciones conocidas de macOS, no todo el software instalado.
  - id: deb_packages
    platforms: [linux]
    purpose: HOST-007
    verified: false
    note: Solo hosts Debian/Ubuntu; el estado indica si el paquete está instalado.
  - id: rpm_packages
    platforms: [linux]
    purpose: HOST-007
    verified: false
    note: Solo hosts RPM; en hosts DEB la tabla falla o está vacía.
  - id: bitlocker_info
    platforms: [windows]
    purpose: HOST-004
    verified: false
    note: >-
      Cifrado BitLocker por volumen; protection_status 1 es protección activa.
      Columnas contrastadas con specs/windows/bitlocker_info.table de osquery 5.24.1.
  - id: windows_security_center
    platforms: [windows]
    purpose: HOST-005
    verified: false
    note: >-
      Salud (Good, Poor, Snoozed, Not Monitored, Error) de firewall, antivirus y
      actualizaciones automáticas. autoupdate es la salud del servicio de Windows
      Update, no la política de actualizaciones; no demuestra que se apliquen.
  - id: programs
    platforms: [windows]
    purpose: HOST-007
    verified: false
    note: Productos instalados con Windows Installer, no todo el software del equipo.
  - id: windows_security_products
    platforms: [windows]
    purpose: HOST-008
    verified: false
    note: >-
      Productos del Centro de seguridad de Windows filtrados a antivirus; vacía en
      Windows Server. Columnas contrastadas con specs/windows/windows_security_products.table
      de osquery 5.24.1; no demuestra por sí sola que el producto funcione.
  - id: gatekeeper
    platforms: [darwin]
    purpose: HOST-009
    verified: false
    note: Estado de Gatekeeper; assessments_enabled 1 es activo.
  - id: xprotect_bundle
    platforms: [darwin]
    purpose: HOST-008
    verified: false
    note: >-
      Versión (CFBundleShortVersionString) y fecha de modificación del Info.plist
      de XProtect en las dos rutas conocidas; la fecha es la del fichero, no la de
      las firmas.
  - id: clamav_signatures
    platforms: [linux]
    purpose: HOST-008
    verified: false
    note: >-
      Fecha y tamaño de las bases de firmas de ClamAV en /var/lib/clamav; la fecha
      es la del fichero, no la versión de las firmas.
  - id: clamav_units
    platforms: [linux]
    purpose: HOST-008
    verified: false
    note: Unidades systemd clamav-*; sirve para comprobar que freshclam está activo.
