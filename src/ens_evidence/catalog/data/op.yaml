- id: op.exp.3
  name: Gestión de la configuración de seguridad
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se gestionará de forma continua la configuración de los componentes del sistema, de forma que:'
  - id: op.exp.3.1
    label: null
    text: Se mantenga en todo momento la regla de "funcionalidad mínima" ([op.exp.2]).
  - id: op.exp.3.2
    label: null
    text: Se mantenga en todo momento la regla de "mínimo privilegio" ([op.exp.2]).
  - id: op.exp.3.3
    label: null
    text: El sistema se adapte a las nuevas necesidades, previamente autorizadas. (Ver [op.acc.4]).
  - id: op.exp.3.4
    label: null
    text: El sistema reaccione a vulnerabilidades notificadas. (Ver [op.exp.4]).
  - id: op.exp.3.5
    label: null
    text: El sistema reaccione a incidentes. (Ver [op.exp.7]).
  - id: op.exp.3.6
    label: null
    text: La configuración de seguridad solamente podrá editarse por personal debidamente autorizado.
  reinforcements:
  - id: R1
    title: Mantenimiento regular de la configuración
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.3.r1.1
      label: null
      text: Existirán configuraciones hardware/software, autorizadas y mantenidas regularmente, para los
        servidores, elementos de red y estaciones de trabajo.
    - id: op.exp.3.r1.2
      label: null
      text: Se verificará periódicamente la configuración hardware/software del sistema para asegurar
        que no se han introducido ni instalado elementos no autorizados.
    - id: op.exp.3.r1.3
      label: null
      text: Se mantendrá una lista de servicios autorizados para servidores y estaciones de trabajo.
  - id: R2
    title: Responsabilidad de la configuración
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.3.r2.1
      label: null
      text: La configuración de seguridad del sistema operativo y aplicaciones, tanto de estaciones y
        servidores como de la electrónica de red del sistema, será responsabilidad de un número muy limitado
        de administradores del sistema.
  - id: R3
    title: Copias de seguridad
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.3.r3.1
      label: null
      text: Se realizarán copias de seguridad de la configuración del sistema de forma que sea posible
        reconstruirlo en parte o en su totalidad tras un incidente.
  - id: R4
    title: Aplicación de la configuración
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.3.r4.1
      label: null
      text: La configuración de seguridad del sistema operativo y de las aplicaciones se mantendrá actualizada
        a través de una aplicación o procedimiento manual que permita la instalación de las correspondientes
        modificaciones de versión y actualizaciones de seguridad oportunas.
  - id: R5
    title: Control del estado de seguridad de la Configuración
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.3.r5.1
      label: null
      text: Se dispondrá de herramientas que permitan conocer de forma periódica el estado de seguridad
        de la configuración de los dispositivos de red y, en el caso de que resulte deficiente, permitir
        su corrección.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      any_of: []
      expression: +R1+R2+R3
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.3.3
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.exp.4
  name: Mantenimiento y actualizaciones de seguridad
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Para mantener el equipamiento físico y lógico que constituye el sistema, se aplicará lo siguiente:'
  - id: op.exp.4.1
    label: null
    text: Se atenderá a las especificaciones de los fabricantes en lo relativo a instalación y mantenimiento
      de los sistemas, lo que incluirá un seguimiento continuo de los anuncios de defectos.
  - id: op.exp.4.2
    label: null
    text: Se dispondrá de un procedimiento para analizar, priorizar y determinar cuándo aplicar las actualizaciones
      de seguridad, parches, mejoras y nuevas versiones. La priorización tendrá en cuenta la variación
      del riesgo en función de la implantación o no de la actualización.
  - id: op.exp.4.3
    label: null
    text: El mantenimiento solo podrá realizarse por personal debidamente autorizado.
  reinforcements:
  - id: R1
    title: Pruebas en preproducción
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.4.r1.1
      label: null
      text: Antes de poner en producción una nueva versión o una versión parcheada, se comprobará en un
        entorno de prueba controlado y consistente en configuración al entorno de producción, que la nueva
        instalación funciona correctamente y no disminuye la eficacia de las funciones necesarias para
        el trabajo diario.
  - id: R2
    title: Prevención de fallos
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.4.r2.1
      label: null
      text: Antes de la aplicación de las configuraciones, parches y actualizaciones de seguridad se preverá
        un mecanismo para revertirlos en caso de aparición de efectos adversos.
  - id: R3
    title: Actualizaciones y pruebas periódicas
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.4.r3.1
      label: null
      text: Se deberá comprobar de forma periódica la integridad del firmware utilizado en los dispositivos
        hardware del sistema (infraestructura de red, BIOS, etc.). La periodicidad de estas comprobaciones
        seguirá las recomendaciones de la Guía CCN-STIC que sea de aplicación.
  - id: R4
    title: Monitorización continua
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.4.r4.1
      label: null
      text: 'Se desplegará a nivel de sistema una estrategia de monitorización continua de amenazas y
        vulnerabilidades. Esta estrategia detallará:

        1. Los indicadores críticos de seguridad a emplear.

        2. La política de aplicación de parches de seguridad de los componentes software relacionados
        en las listas de [op.exp.1.r4], [op.ext.3.r3] y [mp.sw.1.r5]).

        3. Los criterios de revisión regular y excepcional de las amenazas sobre el sistema.'
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      any_of: []
      expression: +R1+R2
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.3.4
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.exp.5
  name: Gestión de cambios
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se mantendrá un control continuo de los cambios realizados en el sistema, de forma que:'
  - id: op.exp.5.1
    label: null
    text: Los cambios se planificarán para reducir el impacto sobre la prestación de los servicios afectados.
      Para ello, todas las peticiones de cambio se registrarán asignando un número de referencia que permita
      su seguimiento, de forma equivalente al registro de los incidentes.
  - id: op.exp.5.2
    label: null
    text: La información a registrar para cada petición de cambio será suficiente para que quien deba
      autorizarlos no tenga dudas al respecto y permita gestionarlo hasta su desestimación o implementación.
  - id: op.exp.5.3
    label: null
    text: Las pruebas de preproducción, siempre que sea posible realizarlas, se efectuarán en equipos
      equivalentes a los de producción, al menos en los aspectos específicos del cambio.
  - id: op.exp.5.4
    label: null
    text: Mediante un análisis de riesgos se determinará si los cambios son relevantes para la seguridad
      del sistema. Aquellos cambios que impliquen un riesgo de nivel ALTO deberán ser aprobados, explícitamente,
      de forma previa a su implantación, por el Responsable de la Seguridad.
  - id: op.exp.5.5
    label: null
    text: Una vez implementado el cambio, se realizarán las pruebas de aceptación convenientes. Si son
      positivas, se actualizará la documentación de configuración (diagramas de red, manuales, el inventario,
      etc.), siempre que proceda.
  reinforcements:
  - id: R1
    title: Prevención de fallos
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.5.r1.1
      label: null
      text: Antes de la aplicación de los cambios, se deberá tener en cuenta la posibilidad de revertirlos
        en caso de la aparición de efectos adversos.
    - id: op.exp.5.r1.2
      label: null
      text: Todos los fallos en el software y hardware deberán ser comunicados al responsable designado
        en la organización de la seguridad.
    - id: op.exp.5.r1.3
      label: null
      text: Todos los cambios en el sistema deberán documentarse, incluyendo una valoración del impacto
        que dicho cambio supone en la seguridad del sistema.
  levels:
    BASICA:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.3.5
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.exp.6
  name: Protección frente a código dañino
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.exp.6.1
    label: null
    text: Se dispondrá de mecanismos de prevención y reacción frente a código dañino, incluyendo el correspondiente
      mantenimiento de acuerdo a las recomendaciones del fabricante.
  - id: op.exp.6.2
    label: null
    text: 'Se instalará software de protección frente a código dañino en todos los equipos: puestos de
      usuario, servidores y elementos perimetrales.'
  - id: op.exp.6.3
    label: null
    text: Todo fichero procedente de fuentes externas será analizado antes de trabajar con él.
  - id: op.exp.6.4
    label: null
    text: Las bases de datos de detección de código dañino permanecerán permanentemente actualizadas.
  - id: op.exp.6.5
    label: null
    text: El software de detección de código dañino instalado en los puestos de usuario deberá estar configurado
      de forma adecuada e implementará protección en tiempo real de acuerdo a las recomendaciones del
      fabricante.
  reinforcements:
  - id: R1
    title: Escaneo periódico
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.6.r1.1
      label: null
      text: Todo el sistema se escaneará regularmente para detectar código dañino.
  - id: R2
    title: Revisión preventiva del sistema
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.6.r2.1
      label: null
      text: Las funciones críticas se analizarán al arrancar el sistema en prevención de modificaciones
        no autorizadas.
  - id: R3
    title: Lista blanca
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.6.r3.1
      label: null
      text: Solamente se podrán ejecutar aquellas aplicaciones previamente autorizadas. Se implementará
        una lista blanca para impedir la ejecución de aplicaciones no autorizadas.
  - id: R4
    title: Capacidad de respuesta en caso de incidente
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.6.r4.1
      label: null
      text: Se emplearán herramientas de seguridad orientadas a detectar, investigar y resolver actividades
        sospechosas en puestos de usuario y servidores (EDR - Endpoint Detection and Response).
  - id: R5
    title: Configuración de la herramienta de detección de código dañino
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.6.r5.1
      label: null
      text: El software de detección de código dañino permitirá realizar configuraciones avanzadas y revisar
        el sistema en el arranque y cada vez que se conecte un dispositivo extraíble.
    - id: op.exp.6.r5.2
      label: null
      text: El software de detección de código dañino instalado en servidores y elementos perimetrales
        deberá estar configurado de forma adecuada e implementará protección en tiempo real de acuerdo
        a las recomendaciones del fabricante.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      any_of: []
      expression: + R1+R2
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      - R4
      any_of: []
      expression: +R1+R2+R3+R4
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.3.6
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.exp.7
  name: Gestión de incidentes
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.exp.7.1
    label: null
    text: Se dispondrá de un proceso integral para hacer frente a los incidentes que puedan tener un impacto
      en la seguridad del sistema, que incluya el informe de eventos de seguridad y debilidades, detallando
      los criterios de clasificación y el escalado de la notificación.
  - id: op.exp.7.2
    label: null
    text: La gestión de incidentes que afecten a datos personales tendrá en cuenta lo dispuesto en el
      Reglamento General de Protección de Datos; la Ley Orgánica 3/2018, de 5 de diciembre, en especial
      su disposición adicional primera, así como el resto de normativa de aplicación, sin perjuicio de
      los requisitos establecidos en este real decreto.
  reinforcements:
  - id: R1
    title: Notificación
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.7.r1.1
      label: null
      text: Se dispondrá de soluciones de ventanilla única para la notificación de incidentes al CCN-CERT,
        que permita la distribución de notificaciones a las diferentes entidades de manera federada, utilizando
        para ello dependencias administrativas jerárquicas.
  - id: R2
    title: Detección y Respuesta
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: 'El proceso integral para hacer frente a los incidentes que puedan tener un impacto en la
        seguridad del sistema ([op.exp.7.1]) deberá incluir:'
    - id: op.exp.7.r2.1
      label: null
      text: Implantación de medidas urgentes, incluyendo la detención de servicios, el aislamiento del
        sistema afectado, la recogida de evidencias y protección de los registros, según convenga al caso.
    - id: op.exp.7.r2.2
      label: null
      text: Asignación de recursos para investigar las causas, analizar las consecuencias y resolver el
        incidente.
    - id: op.exp.7.r2.3
      label: null
      text: Informar del incidente a los responsables de la información y servicios afectados y de las
        actuaciones llevadas a cabo para su resolución.
    - id: op.exp.7.r2.4
      label: null
      text: 'Medidas para:

        a) Prevenir que se repita el incidente.

        b) Incluir en los procedimientos de usuario la identificación y forma de tratar el incidente.

        c) Actualizar, extender, mejorar u optimizar los procedimientos de resolución de incidentes.'
  - id: R3
    title: Reconfiguración dinámica
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: La reconfiguración dinámica del sistema persigue detener, desviar o limitar ataques, acotando
        los daños.
    - id: op.exp.7.r3.1
      label: null
      text: La reconfiguración dinámica incluye, por ejemplo, cambios en las reglas de los enrutadores
        (routers), listas de control de acceso, parámetros del sistema de detección / prevención de intrusiones
        y reglas en los cortafuegos y puertas de enlace, aislamiento de elementos críticos y aislamiento
        de las copias de seguridad.
    - id: op.exp.7.r3.2
      label: null
      text: El organismo adaptará los procedimientos de reconfiguración dinámica reaccionando a los anuncios
        recibidos del CCN-CERT relativos a ciberamenazas sofisticadas y campañas de ataques.
  - id: R4
    title: Prevención y Respuesta Automática
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.7.r4.1
      label: null
      text: Se dispondrá de herramientas que automaticen el proceso de prevención y respuesta mediante
        la detección e identificación de anomalías, la segmentación dinámica de la red para reducir la
        superficie de ataque, el aislamiento de dispositivos críticos, etc.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
