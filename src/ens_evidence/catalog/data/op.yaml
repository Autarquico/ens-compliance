group:
  id: op
  title: Marco operacional
  text:
  - El marco operacional está constituido por las medidas a tomar para proteger la operación del sistema
    como conjunto integral de componentes para un fin.
subgroups:
- id: op.pl
  title: Planificación
  text: []
- id: op.acc
  title: Control de acceso
  text:
  - El control de acceso comprende el conjunto de actividades preparatorias y ejecutivas tendentes a permitir
    o denegar a una entidad, usuario o proceso, el acceso a un recurso del sistema para la realización
    de una acción concreta.
  - Los mecanismos de control de acceso deberán equilibrar la facilidad de uso y la protección de la información
    y los servicios, primando una u otra característica atendiendo a la categoría de seguridad del sistema.
  - Cuando se interconecten sistemas en los que la identificación, autenticación y autorización tengan
    lugar en diferentes dominios de seguridad, bajo distintas responsabilidades, en los casos en que sea
    necesario, las medidas de seguridad locales se acompañarán de los correspondientes acuerdos de colaboración
    que delimiten mecanismos y procedimientos para la atribución y ejercicio efectivos de las responsabilidades
    de cada sistema ([op.ext]).
- id: op.exp
  title: Explotación
  text: []
- id: op.ext
  title: Recursos externos
  text:
  - Cuando la organización utilice recursos externos (servicios, productos, instalaciones o personal),
    mantendrá la plena responsabilidad de los riesgos para la información tratada o los servicios prestados,
    debiendo adoptar las medidas necesarias para ejercer su responsabilidad y mantener el control en todo
    momento.
- id: op.nub
  title: Servicios en la nube
  text: []
- id: op.cont
  title: Continuidad del servicio
  text: []
- id: op.mon
  title: Monitorización del sistema
  text:
  - El sistema estará sujeto a medidas de monitorización de su actividad y ejecutará acciones predeterminadas
    en función de las situaciones de compromiso de la seguridad que figuren en el análisis de riesgos.
    Esto puede incluir la generación de alarmas en tiempo real, la finalización del proceso que está ocasionando
    la alarma, la inhabilitación de determinados servicios, la desconexión de usuarios y el bloqueo de
    cuentas.
measures:
- id: op.pl.1
  name: Análisis de riesgos
  group: op
  subgroup: op.pl
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se realizará un análisis de riesgos informal, realizado en lenguaje natural. Es decir, una
      exposición textual que:'
  - id: op.pl.1.1
    label: null
    text: Identifique los activos más valiosos del sistema. (Ver op.exp.1).
  - id: op.pl.1.2
    label: null
    text: Identifique las amenazas más probables.
  - id: op.pl.1.3
    label: null
    text: Identifique las salvaguardas que protegen de dichas amenazas.
  - id: op.pl.1.4
    label: null
    text: Identifique los principales riesgos residuales.
  reinforcements:
  - id: R1
    title: Análisis de riesgos semiformal
    required_at:
    - MEDIA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: 'Se deberá realizar un análisis de riesgos semiformal, usando un lenguaje específico, con
        un catálogo básico de amenazas y una semántica definida. Es decir, una presentación con tablas
        que:'
    - id: op.pl.1.r1.1
      label: null
      text: Valore cualitativamente los activos más valiosos del sistema.
    - id: op.pl.1.r1.2
      label: null
      text: Cuantifique las amenazas más probables.
    - id: op.pl.1.r1.3
      label: null
      text: Valore las salvaguardas que protegen de dichas amenazas.
    - id: op.pl.1.r1.4
      label: null
      text: Valore el riesgo residual.
  - id: R2
    title: Análisis de riesgos formal
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: 'Se deberá realizar un análisis formal, usando un lenguaje específico, con un fundamento matemático
        reconocido internacionalmente, que:'
    - id: op.pl.1.r2.1
      label: null
      text: Valore cualitativamente los activos más valiosos del sistema.
    - id: op.pl.1.r2.2
      label: null
      text: Cuantifique las amenazas posibles.
    - id: op.pl.1.r2.3
      label: null
      text: Valore y priorice las salvaguardas adecuadas.
    - id: op.pl.1.r2.4
      label: null
      text: Valore y asuma formalmente el riesgo residual.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R2
      any_of: []
      expression: + R2
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.1.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.pl.2
  name: Arquitectura de seguridad
  group: op
  subgroup: op.pl
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'La seguridad del sistema será objeto de un planteamiento integral detallando, al menos, los
      siguientes aspectos:'
  - id: op.pl.2.1
    label: null
    text: Documentación de las instalaciones, incluyendo áreas y puntos de acceso.
  - id: op.pl.2.2
    label: null
    text: Documentación del sistema, incluyendo equipos, redes internas y conexiones al exterior, y puntos
      de acceso al sistema (puestos de trabajo y consolas de administración).
  - id: op.pl.2.3
    label: null
    text: Esquema de líneas de defensa, incluyendo puntos de interconexión a otros sistemas o a otras
      redes (en especial, si se trata de internet o redes públicas en general); cortafuegos, DMZ, etc.;
      y la utilización de tecnologías diferentes para prevenir vulnerabilidades que pudieran perforar
      simultáneamente varias líneas de defensa.
  - id: op.pl.2.4
    label: null
    text: Sistema de identificación y autenticación de usuarios, incluyendo el uso de claves concertadas,
      contraseñas, tarjetas de identificación, biometría, u otras de naturaleza análoga, y el uso de ficheros
      o directorios para autenticar al usuario y determinar sus derechos de acceso.
  reinforcements:
  - id: R1
    title: Sistema de gestión
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.pl.2.r1.1
      label: null
      text: Sistema de gestión, relativo a la planificación, organización y control de los recursos relativos
        a la seguridad de la información.
  - id: R2
    title: Sistema de gestión de la seguridad con mejora continua
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.pl.2.r2.1
      label: null
      text: Sistema de gestión de la seguridad de la información, con actualización y aprobación periódica.
  - id: R3
    title: Validación de datos
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.pl.2.r3.1
      label: null
      text: Controles técnicos internos, incluyendo la validación de datos de entrada, salida y datos
        intermedios.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      any_of: []
      expression: +R1+R2+R3
  notes:
  - La tabla resumen del anexo titula la medida «Arquitectura de Seguridad».
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.1.2
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
