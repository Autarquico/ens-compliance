- id: op.nub.1
  name: Protección de servicios en la nube
  group: op
  subgroup: op.nub
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.nub.1.1
    label: null
    text: 'Los sistemas que suministran un servicio en la nube a organismos del sector público deberán
      cumplir con el conjunto de medidas de seguridad en función del modelo de servicio en la nube que
      presten: Software como Servicio (Software as a Service, SaaS), Plataforma como Servicio (Platform
      as a Service, PaaS) e Infraestructura como Servicio (Infrastructure as a Service, IaaS) definidas
      en las guías CCN-STIC que sean de aplicación.'
  - id: op.nub.1.2
    label: null
    text: 'Cuando se utilicen servicios en la nube suministrados por terceros, los sistemas de información
      que los soportan deberán ser conformes con el ENS o cumplir con las medidas desarrolladas en una
      guía CCN-STIC que incluirá, entre otros, requisitos relativos a:

      a) Auditoría de pruebas de penetración (pentesting).

      b) Transparencia.

      c) Cifrado y gestión de claves.

      d) Jurisdicción de los datos.'
  reinforcements:
  - id: R1
    title: Servicios certificados
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.nub.1.r1.1
      label: null
      text: Cuando se utilicen servicios en la nube suministrados por terceros, estos deberán estar certificados
        bajo una metodología de certificación reconocida por el Organismo de Certificación del Esquema
        Nacional de Evaluación y Certificación de Seguridad de las Tecnologías de la Información.
    - id: op.nub.1.r1.2
      label: null
      text: Si el servicio en la nube es un servicio de seguridad deberá cumplir con los requisitos establecidos
        en [op.pl.5].
  - id: R2
    title: Guías de Configuración de Seguridad Específicas
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.nub.1.r2.1
      label: null
      text: La configuración de seguridad de los sistemas que proporcionan estos servicios deberá realizarse
        según la correspondiente guía CCN-STIC de Configuración de Seguridad Específica, orientadas tanto
        al usuario como al proveedor.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      any_of: []
      expression: +R1+R2
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.5.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.cont.1
  name: Análisis de impacto
  group: op
  subgroup: op.cont
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.cont.1.1
    label: null
    text: Se realizará un análisis de impacto que permita determinar los requisitos de disponibilidad
      de cada servicio (impacto de una interrupción durante un periodo de tiempo determinado), así como
      los elementos que son críticos para la prestación de cada servicio.
  reinforcements: []
  levels:
