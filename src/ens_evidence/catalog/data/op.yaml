- id: op.exp.10
  name: Protección de claves criptográficas
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.exp.10.1
    label: null
    text: 'Las claves criptográficas se protegerán durante todo su ciclo de vida: (1) generación, (2)
      transporte al punto de explotación, (3) custodia durante la explotación, (4) archivo posterior a
      su retirada de explotación activa y (5) destrucción final.'
  - id: op.exp.10.2
    label: null
    text: Los medios de generación estarán aislados de los medios de explotación.
  - id: op.exp.10.3
    label: null
    text: Las claves retiradas de operación que deban ser archivadas, lo serán en medios aislados de los
      de explotación.
  reinforcements:
  - id: R1
    title: Algoritmos autorizados
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.exp.10.r1.1
      label: null
      text: Se emplearán algoritmos y parámetros autorizados por el CCN.
  - id: R2
    title: Protección avanzada de claves criptográficas
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.10.r2.1
      label: null
      text: Se emplearán cifradores que cumplan con los requisitos establecidos en la guía CCN-STIC que
        sea de aplicación.
