- id: op.mon.1
  name: Detección de intrusión
  group: op
  subgroup: op.mon
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.mon.1.1
    label: null
    text: Se dispondrá de herramientas de detección o prevención de intrusiones.
  reinforcements:
  - id: R1
    title: Detección basada en reglas
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.1.r1.1
      label: null
      text: El sistema dispondrá de herramientas de detección o prevención de intrusiones basadas en reglas.
  - id: R2
    title: Procedimientos de respuesta
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.1.r2.1
      label: null
      text: Existirán procedimientos de respuesta a las alertas generadas por el sistema de detección
        o prevención de intrusiones.
  - id: R3
    title: Acciones predeterminadas
    required_at: []
    alternative_at: []
    clauses:
    - id: op.mon.1.r3.1
      label: null
      text: El sistema ejecutará automáticamente acciones predeterminadas de respuesta a las alertas generadas.
        Esto puede incluir la finalización del proceso que está ocasionando la alerta, la inhabilitación
        de determinados servicios, la desconexión de usuarios y el bloqueo de cuentas.
  levels:
