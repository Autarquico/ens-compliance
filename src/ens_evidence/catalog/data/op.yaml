- id: op.exp.9
  name: Registro de la gestión de incidentes
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se registrarán todas las actuaciones relacionadas con la gestión de incidentes, de forma que:'
  - id: op.exp.9.1
    label: null
    text: Se registrarán los reportes iniciales, intermedios y finales de los incidentes, las actuaciones
      de emergencia y las modificaciones del sistema derivadas del incidente.
  - id: op.exp.9.2
    label: null
    text: Se registrará aquella evidencia que pueda dirimirse en un ámbito jurisdiccional, especialmente
      cuando el incidente pueda comportar acciones disciplinarias sobre el personal interno, sobre proveedores
      externos o en la persecución de delitos. En la determinación de la composición y detalle de estas
      evidencias, se recurrirá a asesoramiento legal especializado.
  - id: op.exp.9.3
    label: null
    text: Como consecuencia del análisis de los incidentes, se revisará la determinación de los eventos
      auditables.
