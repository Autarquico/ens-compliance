- id: op.acc.3
  name: Segregación de funciones y tareas
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - C
  - I
  - T
  - A
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: El sistema de control de acceso se organizará de forma que se exija la concurrencia de dos o
      más personas para realizar tareas críticas, anulando la posibilidad de que un solo individuo autorizado
      pueda abusar de sus derechos para cometer alguna acción ilícita o no autorizada.
  - id: op.acc.3.1
    label: null
    text: Siempre que sea posible, las capacidades de desarrollo y operación no recaerán en la misma persona.
  - id: op.acc.3.2
    label: null
    text: Siempre que sea posible, las personas que autorizan y controlan el uso serán distintas.
  reinforcements:
  - id: R1
    title: Segregación rigurosa
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.3.r1.1
      label: null
      text: Siempre que sea posible, la misma persona no aunará funciones de configuración y mantenimiento
        del sistema.
    - id: op.acc.3.r1.2
      label: null
      text: La misma persona no puede aunar funciones de auditoría o supervisión con cualquier otra función.
  - id: R2
    title: Privilegios de auditoría
    required_at: []
    alternative_at: []
    clauses:
    - id: op.acc.3.r2.1
      label: null
      text: Existirán cuentas con privilegios de auditoría estrictamente controladas y personalizadas.
  - id: R3
    title: Acceso a la información de seguridad
    required_at: []
    alternative_at: []
    clauses:
    - id: op.acc.3.r3.1
      label: null
      text: El acceso a la información de seguridad del sistema estará permitido únicamente a los administradores
        de seguridad/sistema autorizados, utilizando los mecanismos de acceso imprescindibles (consola,
        interfaz web, acceso remoto, etc.).
  levels:
    BAJO:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.2.3
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.acc.4
  name: Proceso de gestión de derechos de acceso
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - C
  - I
  - T
  - A
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Los derechos de acceso de cada entidad, usuario o proceso se limitarán atendiendo a los siguientes
      principios:'
  - id: op.acc.4.1
    label: null
    text: Todo acceso estará prohibido, salvo autorización expresa.
  - id: op.acc.4.2
    label: null
    text: 'Mínimo privilegio: los privilegios de cada entidad, usuario o proceso se reducirán al mínimo
      imprescindible para cumplir sus obligaciones o funciones.'
  - id: op.acc.4.3
    label: null
    text: 'Necesidad de conocer y responsabilidad de compartir: los privilegios se asignarán de forma
      que las entidades, usuarios o procesos sólo accederán al conocimiento de aquella información requerida
      para cumplir sus obligaciones o funciones. La información es patrimonio del organismo y toda aquella
      que resulte necesaria para el usuario estará a su disposición.'
  - id: op.acc.4.4
    label: null
    text: 'Capacidad de autorizar: Exclusivamente el personal con competencia para ello podrá conceder,
      alterar o anular la autorización de acceso a los recursos, conforme a los criterios establecidos
      por su responsable. Los permisos de acceso se revisarán de forma periódica.'
  - id: op.acc.4.5
    label: null
    text: Se establecerá una política específica de acceso remoto, requiriéndose autorización expresa.
  reinforcements: []
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.2.4
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.acc.5
  name: Mecanismo de autenticación (usuarios externos)
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - C
  - I
  - T
  - A
  preamble:
  - Referente a usuarios que no son usuarios de la organización.
  - Las guías CCN-STIC desarrollarán los mecanismos y calidades exigibles a cada tipo de factor de autenticación
    en función de los niveles de seguridad requeridos por el sistema de información el que se accede y
    los privilegios concedidos al usuario.
  diagram_refs: []
  base:
  - id: op.acc.5.1
    label: null
    text: Antes de proporcionar las credenciales de autenticación a las entidades, usuarios o procesos,
      estos deberán haberse identificado y registrado de manera fidedigna ante el sistema o ante un Prestador
      Cualificado de Servicios de Confianza o un proveedor de identidad electrónica reconocido por las
      administraciones públicas, de conformidad con lo dispuesto en la Ley 39/2015, de 1 de octubre.
  - id: op.acc.5.2
    label: null
    text: Antes de activar el mecanismo de autenticación, el usuario reconocerá que las ha recibido y
      que conoce y acepta las obligaciones que implica su tenencia, en particular, el deber de custodia
      diligente, la protección de su confidencialidad y el deber de notificación inmediata en caso de
      pérdida.
  - id: op.acc.5.3
    label: null
    text: Las credenciales estarán bajo el control exclusivo del usuario y se activarán una vez estén
      bajo su control efectivo.
  - id: op.acc.5.4
    label: null
    text: Las credenciales se cambiarán con una periodicidad marcada por la política de seguridad de la
      organización.
  - id: op.acc.5.5
    label: null
    text: Las credenciales serán inhabilitadas -pudiendo ser regeneradas, en su caso-, cuando conste o
      se sospeche su pérdida, compromiso o revelación a entidades (personas, equipos o procesos) no autorizadas.
  - id: op.acc.5.6
    label: null
    text: Las credenciales serán inhabilitadas cuando la entidad (persona, equipo o proceso) que autentican
      termina su relación con el sistema.
  - id: op.acc.5.7
    label: null
    text: Antes de autorizar el acceso, la información presentada por el sistema será la mínima imprescindible
      para que el usuario se autentique, evitando todo aquello que pueda, directa o indirectamente, revelar
      información sobre el sistema o la cuenta, sus características, su operación o su estado. Las credenciales
      solamente se validarán cuando se tengan todos los datos necesarios y, si se rechaza, no se informará
      del motivo del rechazo.
  - id: op.acc.5.8
    label: null
    text: El número de intentos permitidos será limitado, bloqueando la oportunidad de acceso una vez
      superado tal número, y requiriendo una intervención específica para reactivar la cuenta, que se
      describirá en la documentación.
  - id: op.acc.5.9
    label: null
    text: El sistema informará al usuario de sus derechos u obligaciones inmediatamente después de obtener
      el acceso.
  reinforcements:
  - id: R1
    title: Contraseñas
    required_at: []
    alternative_at:
    - BAJO
    clauses:
    - id: op.acc.5.r1.1
      label: null
      text: Se empleará una contraseña como mecanismo de autenticación.
    - id: op.acc.5.r1.2
      label: null
      text: Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver
        guías CCN-STIC).
  - id: R2
    title: Contraseña + OTP
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.5.r2.1
      label: null
      text: Se requerirá una contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña
        de usuario.
  - id: R3
    title: Certificados
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.5.r3.1
      label: null
      text: Se emplearán certificados cualificados como mecanismo de autenticación.
    - id: op.acc.5.r3.2
      label: null
      text: El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.
    - id: op.acc.5.r3.3
      label: null
      text: Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial,
        o bien telemático, usando un certificado electrónico cualificado.
  - id: R4
    title: Certificados en dispositivo físico
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.5.r4.1
      label: null
      text: Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico
        (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.
    - id: op.acc.5.r4.2
      label: null
      text: El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.
    - id: op.acc.5.r4.3
      label: null
      text: Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial,
        o bien telemático, usando certificado electrónico cualificado.
  - id: R5
    title: Registro
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.5.r5.1
      label: null
      text: Se registrarán los accesos con éxito y los fallidos.
    - id: op.acc.5.r5.2
      label: null
      text: Se informará al usuario del último acceso efectuado con su identidad.
  - id: R6
    title: Limitación de la ventana de acceso
    required_at: []
    alternative_at: []
    clauses:
    - id: op.acc.5.r6.1
      label: null
      text: Se definirán aquellos puntos en los que el sistema requerirá una renovación de la autenticación
        del usuario, mediante identificación singular, no bastando con la sesión establecida.
  - id: R7
    title: Suspensión por no utilización
    required_at: []
    alternative_at: []
    clauses:
    - id: op.acc.5.r7.1
      label: null
      text: Las credenciales se suspenderán tras un periodo definido de no utilización.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of:
      - - R1
        - R2
        - R3
        - R4
      expression: + [R1 o R2 o R3 o R4]
    MEDIO:
      not_applicable: false
      all_of:
      - base
      - R5
      any_of:
      - - R2
        - R3
        - R4
      expression: + [R2 o R3 o R4] + R5
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R5
      any_of:
      - - R2
        - R3
        - R4
      expression: + [R2 o R3 o R4] + R5
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.2.5
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.acc.6
  name: Mecanismo de autenticación (usuarios de la organización)
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - C
  - I
  - T
  - A
  preamble:
  - Esta medida se refiere a personal del organismo, propio o contratado, estable o circunstancial, que
    pueda tener acceso a información contenida en el sistema.
  - Las guías CCN-STIC desarrollarán los mecanismos y calidades exigibles a cada tipo de factor de autenticación,
    en función de los niveles de seguridad requeridos por el sistema de información el que se accede y
    los privilegios concedidos al usuario.
  diagram_refs: []
  base:
  - id: op.acc.6.1
    label: null
    text: Antes de proporcionar las credenciales a los usuarios, estos deberán conocer y aceptar la política
      de seguridad del organismo en los aspectos que les afecten.
  - id: op.acc.6.2
    label: null
    text: Antes de activar el mecanismo de autenticación, el usuario reconocerá que ha recibido las credenciales
      de acceso y que conoce y acepta las obligaciones que implica su tenencia, en particular, el deber
      de custodia diligente, la protección de su confidencialidad y el deber de notificación inmediata
      en caso de pérdida.
  - id: op.acc.6.3
    label: null
    text: Las credenciales estarán bajo el control exclusivo del usuario y se activarán una vez estén
      bajo su control efectivo.
  - id: op.acc.6.4
    label: null
    text: Las credenciales se cambiarán con una periodicidad marcada por la política de seguridad de la
      organización.
  - id: op.acc.6.5
    label: null
    text: Las credenciales serán inhabilitadas -pudiendo ser regeneradas, en su caso-, cuando conste o
      se sospeche su pérdida, compromiso o revelación a entidades (personas, equipos o procesos) no autorizadas.
  - id: op.acc.6.6
    label: null
    text: Las credenciales serán inhabilitadas cuando el usuario que autentican termina su relación con
      el sistema.
  - id: op.acc.6.7
    label: null
    text: Antes de autorizar el acceso, la información presentada por el sistema será la mínima imprescindible
      para que el usuario se autentique, evitando todo aquello que pueda, directa o indirectamente, revelar
      información sobre el sistema o la cuenta, sus características, su operación o su estado. Las credenciales
      solamente se validarán cuando se tengan todos los datos necesarios y, si se rechaza, no se informará
      del motivo del rechazo.
  - id: op.acc.6.8
    label: null
    text: El número de intentos permitidos será limitado, bloqueando la oportunidad de acceso una vez
      superado tal número, y requiriendo una intervención específica para reactivar la cuenta, que se
      describirá en la documentación.
  - id: op.acc.6.9
    label: null
    text: El sistema informará al usuario de sus derechos u obligaciones inmediatamente después de obtener
      el acceso.
  reinforcements:
  - id: R1
    title: Contraseñas
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.6.r1.1
      label: null
      text: Se empleará una contraseña como mecanismo de autenticación cuando el acceso se realiza desde
        zonas controladas y sin atravesar zonas no controladas (véase refuerzo R8).
    - id: op.acc.6.r1.2
      label: null
      text: Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver
        guías CCN-STIC).
  - id: R2
    title: Contraseña + otro factor de autenticación
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.6.r2.1
      label: null
      text: Se requerirá un segundo factor tal como «algo que se tiene», es decir, un dispositivo, una
        contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña de usuario, o «algo
        que se es».
  - id: R3
    title: Certificados
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.6.r3.1
      label: null
      text: Se emplearán certificados cualificados como mecanismo de autenticación.
    - id: op.acc.6.r3.2
      label: null
      text: El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.
  - id: R4
    title: Certificados en dispositivo físico
    required_at: []
    alternative_at:
    - BAJO
    - MEDIO
    - ALTO
    clauses:
    - id: op.acc.6.r4.1
      label: null
      text: Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico
        (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.
    - id: op.acc.6.r4.2
      label: null
      text: El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.
  - id: R5
    title: Registro
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.6.r5.1
      label: null
      text: Se registrarán los accesos con éxito y los fallidos.
    - id: op.acc.6.r5.2
      label: null
      text: Se informará al usuario del último acceso efectuado con su identidad.
  - id: R6
    title: Limitación de la ventana de acceso
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.6.r6.1
      label: null
      text: Se definirán aquellos puntos en los que el sistema requerirá una renovación de la autenticación
        del usuario, mediante identificación singular, no bastando con la sesión establecida.
  - id: R7
    title: Suspensión por no utilización
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.6.r7.1
      label: null
      text: Las credenciales se suspenderán tras un periodo definido de no utilización.
  - id: R8
    title: Doble factor para acceso desde o a través de zonas no controladas
    required_at:
    - BAJO
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: Se denomina «zona controlada» aquella que no es de acceso público, requiriéndose que el usuario,
        antes de tener acceso al equipo, se haya autenticado previamente de alguna forma (control de acceso
        a las instalaciones), diferente del mecanismo de autenticación lógica frente al sistema. Un ejemplo
        de zona no controlada es Internet.
    - id: op.acc.6.r8.1
      label: null
      text: 'Para el acceso desde o a través de zonas no controladas se requerirá un doble factor de autenticación:
        R2, R3 o R4.'
  - id: R9
    title: Acceso remoto (todos los niveles)
    required_at:
    - BAJO
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.6.r9.1
      label: null
      text: Será de aplicación la ITS de Interconexión de sistemas de información.
    - id: op.acc.6.r9.2
      label: null
      text: 'El acceso remoto deberá considerar los siguientes aspectos:

        a) Ser autorizado por la autoridad correspondiente.

        b) El tráfico deberá ser cifrado.

        c) Si la utilización no se produce de manera constante, el acceso remoto deberá encontrarse inhabilitado
        y habilitarse únicamente cuando sea necesario.

        d) Deberán recogerse registros de auditoría de este tipo de conexiones.'
  levels:
