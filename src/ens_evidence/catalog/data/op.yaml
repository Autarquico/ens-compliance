- id: op.pl.5
  name: Componentes certificados
  group: op
  subgroup: op.pl
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.pl.5.1
    label: null
    text: . Se utilizará el Catálogo de Productos y Servicios de Seguridad de las Tecnologías de la Información
      y Comunicación (CPSTIC) del CCN, para seleccionar los productos o servicios suministrados por un
      tercero que formen parte de la arquitectura de seguridad del sistema y aquellos que se referencien
      expresamente en las medidas de este real decreto.
  - id: null
    label: null
    text: En caso de que no existan productos o servicios en el CPSTIC que implementen las funcionalidades
      requeridas, se utilizarán productos certificados de acuerdo a lo descrito en el artículo 19.
  - id: null
    label: null
    text: Una Instrucción Técnica de Seguridad detallará los criterios relativos a la adquisición de productos
      de seguridad.
  - id: op.pl.5.2
    label: null
    text: Si el sistema suministra un servicio de seguridad a un tercero bajo el alcance del ENS, el producto
      o productos que en los que se sustente dicho servicio debe superar un proceso de cualificación y
      ser incluido en el CPSTIC, o aportar una certificación que cumpla con los requisitos funcionales
      de seguridad y de aseguramiento de acuerdo a lo establecido en el artículo 19.
  reinforcements:
  - id: R1
    title: Protección de emisiones electromagnéticas
    required_at: []
    alternative_at: []
    clauses:
    - id: op.pl.5.r1.1
      label: null
      text: La información deberá ser protegida frente a las amenazas TEMPEST de acuerdo con la normativa
        en vigor.
  - id: R2
    title: Lista de componentes software
    required_at: []
    alternative_at: []
    clauses:
    - id: op.pl.5.r2.1
      label: null
      text: Cada producto y servicio incluirá en su descripción una lista de componentes software, acorde
        a lo especificado en [mp.sw.1.r5].
  levels:
    BASICA:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.1.5
