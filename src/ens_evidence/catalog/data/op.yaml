      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.6.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.cont.2
  name: Plan de continuidad
  group: op
  subgroup: op.cont
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se desarrollará un plan de continuidad que establezca las acciones a ejecutar en caso de interrupción
      de los servicios prestados con los medios habituales. Dicho plan contemplará los siguientes aspectos:'
  - id: op.cont.2.1
    label: null
    text: Se identificarán funciones, responsabilidades y actividades a realizar.
  - id: op.cont.2.2
    label: null
    text: Existirá una previsión para coordinar la entrada en servicio de los medios alternativos de forma
      que se garantice poder seguir prestando los servicios esenciales de la organización.
  - id: op.cont.2.3
    label: null
    text: Todos los medios alternativos estarán planificados y materializados en acuerdos o contratos
      con los proveedores correspondientes.
  - id: op.cont.2.4
    label: null
    text: Las personas afectadas por el plan recibirán formación específica relativa a su papel en dicho
      plan.
  - id: op.cont.2.5
    label: null
    text: El plan de continuidad será parte integral y armónica de los planes de continuidad de la organización
      en otras materias ajenas a la seguridad.
  reinforcements:
  - id: R1
    title: Plan de emergencia y contingencia
    required_at: []
    alternative_at: []
    clauses:
    - id: op.cont.2.r1.1
      label: null
      text: Cuando se determine la necesidad de continuidad de los sistemas, deberá existir un plan de
        emergencia y contingencia en consonancia. En función del análisis de Impacto, se determinarán
        los aspectos a cubrir.
  - id: R2
    title: Comprobación de integridad
    required_at: []
