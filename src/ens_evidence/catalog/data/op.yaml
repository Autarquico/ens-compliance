- id: op.cont.4
  name: Medios alternativos
  group: op
  subgroup: op.cont
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.cont.4.1
    label: null
    text: 'Estará prevista la disponibilidad de medios alternativos para poder seguir prestando servicio
      cuando los medios habituales no estén disponibles. En concreto, se cubrirán los siguientes elementos
      del sistema:

      a) Servicios contratados a terceros.

      b) Instalaciones alternativas.

      c) Personal alternativo.

      d) Equipamiento informático alternativo.

      e) Medios de comunicación alternativos.'
  - id: op.cont.4.2
    label: null
    text: Se establecerá un tiempo máximo para que los medios alternativos entren en funcionamiento.
  - id: op.cont.4.3
    label: null
    text: Los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales.
  reinforcements:
  - id: R1
    title: Automatización de la transición a medios alternativos
    required_at: []
    alternative_at: []
    clauses:
    - id: op.cont.4.r1.1
      label: null
      text: El sistema dispondrá de elementos hardware o software que permitan la transferencia de los
        servicios automáticamente a los medios alternativos.
