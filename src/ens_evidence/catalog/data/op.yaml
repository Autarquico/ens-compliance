- id: op.mon.2
  name: Sistema de métricas
  group: op
  subgroup: op.mon
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.mon.2.1
    label: null
    text: Atendiendo a la categoría de seguridad del sistema, se recopilarán los datos necesarios para
      conocer el grado de implantación de las medidas de seguridad que resulten aplicables y, en su caso,
      para proveer el informe anual requerido por el artículo 32.
  reinforcements:
  - id: R1
    title: Efectividad del sistema de gestión de incidentes
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.2.r1.1
      label: null
      text: Se recopilarán los datos precisos que posibiliten evaluar el comportamiento del sistema de
        gestión de incidentes, de acuerdo con la Instrucción Técnica de Seguridad de Notificación de Incidentes
        de Seguridad y con la correspondiente guía CCN-STIC.
  - id: R2
    title: Eficiencia del sistema de gestión de la seguridad
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.2.r2.1
      label: null
      text: Se recopilarán los datos precisos para conocer la eficiencia del sistema de seguridad, en
        relación con los recursos consumidos, en términos de horas y presupuesto.
  levels:
    BASICA:
      not_applicable: false
