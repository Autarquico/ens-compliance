- id: op.acc.1
  name: Identificación
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - T
  - A
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'La identificación de los usuarios del sistema se realizará de acuerdo con lo que se indica
      a continuación:'
  - id: op.acc.1.1
    label: null
    text: Se podrá utilizar como identificador único los sistemas de identificación previstos en la normativa
      de aplicación, entre ellos, los sistemas de clave concertada y cualquier otro sistema que las administraciones
      consideren válido en los términos y condiciones establecidos en la Ley 39/2015, de 1 de octubre,
      del Procedimiento Administrativo Común de las Administraciones Públicas.
  - id: op.acc.1.2
    label: null
    text: Cuando el usuario tenga diferentes roles frente al sistema (como ciudadano o usuario final,
      como trabajador del organismo o como administrador de los sistemas, por ejemplo) recibirá identificadores
      singulares para cada perfil, de forma que se recaben siempre los correspondientes registros de actividad,
      delimitándose los privilegios correspondientes a cada perfil.
  - id: op.acc.1.3
    label: null
    text: Cada entidad (entidad, usuario o proceso) que accede al sistema, contará con un identificador
      singular que permita conocer el destinatario de los mismos y los derechos de acceso que recibe,
      así como las acciones realizadas por cada entidad.
  - id: op.acc.1.4
    label: null
    text: 'Las cuentas de usuario se gestionarán de la siguiente forma:

      a) Cada cuenta (de entidad, usuario o proceso) estará asociada a un identificador único.

      b) Las cuentas deben ser inhabilitadas en los siguientes casos: cuando el usuario deja la organización;
      cuando el usuario cesa en la función para la cual se requería la cuenta de usuario; o, cuando la
      persona que la autorizó da orden en sentido contrario.

      c) Las cuentas se retendrán durante el periodo necesario para atender a las necesidades de trazabilidad
      de los registros de actividad asociados a las mismas. A este periodo se le denominará «periodo de
      retención».'
  - id: op.acc.1.5
    label: null
    text: 'En los supuestos de comunicaciones electrónicas, las partes intervinientes se identificarán
      atendiendo a los mecanismos previstos en la legislación europea y nacional en la materia, con la
      siguiente correspondencia entre los niveles de la dimensión de autenticidad de los sistemas de información
      a los que se tiene acceso y los niveles de seguridad (bajo, sustancial, alto) de los sistemas de
      identificación electrónica previstos en el Reglamento (UE) n.º 910/2014, del Parlamento Europeo
      y del Consejo, de 23 de julio de 2014, relativo a la identificación electrónica y los servicios
      de confianza para las transacciones electrónicas en el mercado interior y por el que se deroga la
      Directiva 1999/93/CE y sus normas de desarrollo o ejecución que resulten de aplicación:

      a) Si se requiere un nivel BAJO en la dimensión de autenticidad (anexo I): Nivel de seguridad bajo,
      sustancial o alto (artículo 8 del Reglamento (UE) n.º 910/2014).

      b) Si se requiere un nivel MEDIO en la dimensión de autenticidad (anexo I): Nivel de seguridad sustancial
      o alto (artículo 8 del Reglamento (UE) n.º 910/2014).

      c) Si se requiere un nivel ALTO en la dimensión de autenticidad (anexo I): Nivel de seguridad alto
      (artículo 8 del Reglamento (UE) n.º 910/2014).'
  reinforcements:
  - id: R1
    title: Identificación avanzada
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.1.r1.1
      label: null
      text: La identificación del usuario permitirá al Responsable del Sistema, al Responsable de la Seguridad
        o a sus respectivos administradores delegados, singularizar a la persona asociada al mismo, así
        como sus responsabilidades en el sistema.
    - id: op.acc.1.r1.2
      label: null
      text: Los datos de identificación serán utilizados por el sistema para determinar los privilegios
        del usuario conforme a los requisitos de control de acceso establecidos en la documentación de
        seguridad.
    - id: op.acc.1.r1.3
      label: null
      text: Se asegurará la existencia de una lista actualizada de usuarios autorizados y mantenida por
        el administrador del sistema/de la seguridad del sistema.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.2.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: op.acc.2
  name: Requisitos de acceso
  group: op
  subgroup: op.acc
  applies_by: dimension
  dimensions:
  - C
  - I
  - T
  - A
  preamble: []
  diagram_refs: []
  base:
  - id: op.acc.2.1
    label: null
    text: Los recursos del sistema se protegerán con algún mecanismo que impida su utilización, salvo
      a las entidades que disfruten de derechos de acceso suficientes.
  - id: op.acc.2.2
    label: null
    text: Los derechos de acceso de cada recurso, se establecerán según las decisiones de la persona responsable
      del recurso, ateniéndose a la política y normativa de seguridad del sistema.
  - id: op.acc.2.3
    label: null
    text: Particularmente, se controlará el acceso a los componentes del sistema operativo y a sus ficheros
      o registros de configuración.
  reinforcements:
  - id: R1
    title: Privilegios de acceso
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: op.acc.2.r1.1
      label: null
      text: Todos los usuarios autorizados deben tener un conjunto de atributos de seguridad (privilegios)
        que puedan ser mantenidos individualmente.
    - id: op.acc.2.r1.2
      label: null
      text: Los privilegios de acceso se implementarán para restringir el tipo de acceso que un usuario
        puede tener (lectura, escritura, modificación, borrado, etc.).
  - id: R2
    title: Control de acceso a dispositivos
    required_at: []
    alternative_at: []
    clauses:
    - id: op.acc.2.r2.1
      label: null
      text: Se dispondrá de soluciones que permitan establecer controles de acceso a los dispositivos
        en función de la política de seguridad de la organización.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 4.2.2
