- id: op.exp.1
  name: Inventario de activos
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.exp.1.1
    label: null
    text: Se mantendrá un inventario actualizado de todos los elementos del sistema, detallando su naturaleza
      e identificando a su responsable; es decir, la persona que toma las decisiones relativas al mismo.
  reinforcements:
  - id: R1
    title: Inventario de etiquetado
    required_at: []
    alternative_at: []
    clauses:
