- id: op.mon.3
  name: Vigilancia
  group: op
  subgroup: op.mon
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.mon.3.1
    label: null
    text: Se dispondrá de un sistema automático de recolección de eventos de seguridad.
  reinforcements:
  - id: R1
    title: Correlación de eventos
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.3.r1.1
      label: null
      text: Se dispondrá de un sistema automático de recolección de eventos de seguridad que permita la
        correlación de los mismos.
  - id: R2
    title: Análisis dinámico
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.3.r2.1
      label: null
      text: Se dispondrá de soluciones de vigilancia que permitan determinar la superficie de exposición
        con relación a vulnerabilidades y deficiencias de configuración.
  - id: R3
    title: Ciberamenazas avanzadas
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.3.r3.1
      label: null
      text: Se dispondrá de sistemas para detección de amenazas avanzadas y comportamientos anómalos.
    - id: op.mon.3.r3.2
      label: null
      text: Se dispondrá de sistemas para la detección de amenazas persistentes avanzadas (Advanced Persistent
        Threat, APT) mediante la detección de anomalías significativas en el tráfico de la red.
  - id: R4
    title: Observatorios digitales
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.mon.3.r4.1
      label: null
      text: Se dispondrá de observatorios digitales con fines de cibervigilancia dedicados a la detección
        y seguimiento de anomalías que pudieran representar indicadores de amenaza en contenidos digitales.
  - id: R5
    title: Minería de datos
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: 'Se aplicarán medidas para prevenir, detectar y reaccionar frente a intentos de minería de
        datos:'
    - id: op.mon.3.r5.1
      label: null
      text: Limitación de las consultas, monitorizando volumen y frecuencia.
    - id: op.mon.3.r5.2
      label: null
      text: Alerta a los administradores de seguridad de comportamientos sospechosos en tiempo real.
  - id: R6
    title: Inspecciones de seguridad
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: null
      label: null
      text: 'Periódicamente, o tras incidentes que hayan desvelado vulnerabilidades del sistema nuevas
        o subestimadas, se realizarán las siguientes inspecciones:'
    - id: op.mon.3.r6.1
      label: null
      text: Verificación de configuración.
    - id: op.mon.3.r6.2
      label: null
      text: Análisis de vulnerabilidades.
    - id: op.mon.3.r6.3
      label: null
      text: Pruebas de penetración.
  - id: R7
    title: Interconexiones
    required_at: []
    alternative_at: []
    clauses:
    - id: op.mon.3.r7.1
      label: null
      text: En las interconexiones que lo requieran se aplicarán controles en los flujos de intercambio
        de información a través del uso de metadatos.
