    title: Identificación periódica de activos
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.1.r2.1
      label: null
      text: Se dispondrá de herramientas que permitan visualizar de forma continua el estado de todos
        los equipos en la red, en particular, los servidores y los dispositivos de red y de comunicaciones.
  - id: R3
    title: Identificación de activos críticos
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.1.r3.1
      label: null
      text: Se dispondrá de herramientas que permitan categorizar los activos críticos por contexto de
        la organización y riesgos de seguridad.
  - id: R4
    title: Lista de componentes software
    required_at: []
    alternative_at: []
    clauses:
    - id: op.exp.1.r4.1
      label: null
      text: Se mantendrá actualizada una relación formal de los componentes software de terceros empleados
        en el despliegue del sistema. Esta lista incluirá librerías software y los servicios requeridos
        para su despliegue (plataforma o entorno operacional). El contenido de la lista de componentes
        será equivalente a lo requerido en [mp.sw.1.r5].
