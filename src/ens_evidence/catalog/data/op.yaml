- id: op.ext.3
  name: Protección de la cadena de suministro
  group: op
  subgroup: op.ext
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: op.ext.3.1
    label: null
    text: Se analizará el impacto que puede tener sobre el sistema un incidente accidental o deliberado
      que tenga su origen en la cadena de suministro.
  - id: op.ext.3.2
    label: null
    text: Se estimará el riesgo sobre el sistema por causa del impacto estimado en el punto anterior.
  - id: op.ext.3.3
    label: null
    text: Se tomarán medidas de contención de los impactos estimados en los puntos anteriores.
  reinforcements:
  - id: R1
    title: Plan de contingencia
    required_at: []
    alternative_at: []
    clauses:
    - id: op.ext.3.r1.1
      label: null
      text: El plan de continuidad de la organización deberá tener en cuenta la dependencia de proveedores
        externos críticos.
    - id: op.ext.3.r1.2
      label: null
      text: Se deberán realizar pruebas o ejercicios de continuidad, incluyendo escenarios en los que
        falla un proveedor.
  - id: R2
    title: Sistema de gestión de la seguridad
    required_at: []
    alternative_at: []
    clauses:
    - id: op.ext.3.r2.1
      label: null
      text: Se implementará un sistema de protección de los procesos y flujos de información en las relaciones
        en línea (online) entre los distintos integrantes de la cadena de suministro.
  - id: R3
    title: Lista de componentes software
    required_at: []
    alternative_at: []
    clauses:
    - id: op.ext.3.r3.1
      label: null
      text: Se mantendrá actualizado un registro formal que contenga los detalles y las relaciones de
        la cadena de suministro de los diversos componentes utilizados en la construcción de programas
        informáticos, acorde a lo especificado en [mp.sw.1.r5]. Esta lista será proporcionada por el proveedor
        de la aplicación, librería o producto suministrado.
  levels:
