- id: op.exp.2
  name: Configuración de seguridad
  group: op
  subgroup: op.exp
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se configurarán los equipos previamente a su entrada en operación, de forma que:'
  - id: op.exp.2.1
    label: null
    text: Se retiren cuentas y contraseñas estándar.
  - id: op.exp.2.2
    label: null
    text: 'Se aplicará la regla de «mínima funcionalidad», es decir:

      a) El sistema debe proporcionar la funcionalidad mínima imprescindible para que la organización
      alcance sus objetivos.

      b) No proporcionará funciones injustificadas (de operación, administración o auditoría) al objeto
      de reducir al mínimo su perímetro de exposición, eliminándose o desactivándose aquellas funciones
      que sean innecesarias o inadecuadas al fin que se persigue.'
  - id: op.exp.2.3
    label: null
    text: 'Se aplicará la regla de «seguridad por defecto», es decir:

      a) Las medidas de seguridad serán respetuosas con el usuario y protegerán a éste, salvo que se exponga
      conscientemente a un riesgo.

      b) Para reducir la seguridad, el usuario tendrá que realizar acciones conscientes.

      c) El uso natural, en los casos que el usuario no ha consultado el manual, será un uso seguro.'
  - id: op.exp.2.4
    label: null
    text: Las máquinas virtuales estarán configuradas y gestionadas de un modo seguro. La gestión del
      parcheado, cuentas de usuarios, software antivirus, etc. se realizará como si se tratara de máquinas
      físicas, incluyendo la máquina anfitriona.
  reinforcements: []
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
