- id: op.exp.8
  name: Registro de la actividad
  group: op
  subgroup: op.exp
  applies_by: dimension
  dimensions:
  - T
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se registrarán las actividades en el sistema, de forma que:'
  - id: op.exp.8.1
    label: null
    text: Se generará un registro de auditoría, que incluirá, al menos, el identificador del usuario o
      entidad asociado al evento, fecha y hora, sobre qué información se realiza el evento, tipo de evento
      y el resultado del evento (fallo o éxito), según la política de seguridad y los procedimientos asociados
      a la misma.
  - id: op.exp.8.2
    label: null
    text: Se activarán los registros de actividad en los servidores.
  reinforcements:
  - id: R1
    title: Revisión de los registros
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.exp.8.r1.1
      label: null
      text: Se revisarán informalmente, de forma periódica, los registros de actividad, buscando patrones
        anormales.
  - id: R2
    title: Sincronización del reloj del sistema
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.exp.8.r2.1
      label: null
      text: El sistema deberá disponer de una referencia de tiempo (timestamp) para facilitar las funciones
        de registro de eventos y auditoría. La modificación de la referencia de tiempo del sistema será
        una función de administración y, en caso de realizarse su sincronización con otros dispositivos,
        deberán utilizarse mecanismos de autenticación e integridad.
  - id: R3
    title: Retención de registros
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.exp.8.r3.1
      label: null
      text: En la documentación de seguridad del sistema se deberán indicar los eventos de seguridad que
        serán auditados y el tiempo de retención de los registros antes de ser eliminados.
  - id: R4
    title: Control de acceso
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: op.exp.8.r4.1
      label: null
      text: Los registros de actividad y, en su caso, las copias de seguridad de los mismos, solamente
        podrán ser accedidos o eliminarse por personal debidamente autorizado.
  - id: R5
    title: Revisión automática y correlación de eventos
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: op.exp.8.r5.1
      label: null
      text: El sistema deberá implementar herramientas para analizar y revisar la actividad del sistema
        y la información de auditoría, en búsqueda de comprometimientos de la seguridad posibles o reales.
    - id: op.exp.8.r5.2
      label: null
      text: Se dispondrá de un sistema automático de recolección de registros, correlación de eventos
        y respuesta automática ante los mismos.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      - R4
      any_of: []
      expression: +R1+R2+R3+R4
