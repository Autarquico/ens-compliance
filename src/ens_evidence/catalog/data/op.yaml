      text: Se realizará una previsión de la capacidad y se mantendrá actualizada durante todo el ciclo
        de vida del sistema.
    - id: op.pl.4.r1.2
      label: null
      text: Se emplearán herramientas y recursos para la monitorización de la capacidad.
