- id: op.pl.4
  name: Dimensionamiento / gestión de la capacidad
  group: op
  subgroup: op.pl
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Con carácter previo a la puesta en explotación, se realizará un estudio que cubrirá los siguientes
      aspectos:'
  - id: op.pl.4.1
    label: null
    text: Necesidades de procesamiento.
  - id: op.pl.4.2
    label: null
    text: 'Necesidades de almacenamiento de información: durante su procesamiento y durante el periodo
      que deba retenerse.'
  - id: op.pl.4.3
    label: null
    text: Necesidades de comunicación.
  - id: op.pl.4.4
    label: null
    text: 'Necesidades de personal: cantidad y cualificación profesional.'
  - id: op.pl.4.5
    label: null
    text: Necesidades de instalaciones y medios auxiliares.
  reinforcements:
  - id: R1
