- id: op.ext.4
  name: Interconexión de sistemas
  group: op
  subgroup: op.ext
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble:
  - Se denomina interconexión al establecimiento de enlaces con otros sistemas de información para el
    intercambio de información y servicios.
  diagram_refs: []
  base:
  - id: op.ext.4.1
    label: null
    text: Todos los intercambios de información y prestación de servicios con otros sistemas deberán ser
      objeto de una autorización previa. Todo flujo de información estará prohibido salvo autorización
      expresa.
  - id: op.ext.4.2
    label: null
    text: 'Para cada interconexión se documentará explícitamente: las características de la interfaz,
      los requisitos de seguridad y protección de datos y la naturaleza de la información intercambiada.'
  reinforcements:
  - id: R1
    title: Coordinación de actividades
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: op.ext.4.r1.1
      label: null
      text: Cuando se interconecten sistemas en los que la identificación, autenticación y autorización
        tengan lugar en diferentes dominios de seguridad, bajo distintas responsabilidades, las medidas
        de seguridad locales se acompañarán de los correspondientes mecanismos y procedimientos de coordinación
        para la atribución y ejercicio efectivos de las responsabilidades de cada sistema.
  levels:
