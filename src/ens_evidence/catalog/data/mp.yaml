      cursos, presentaciones- etc.) que contengan información que según [mp.info.2] deba protegerse con
      medidas de seguridad específicas, llevarán las marcas o metadatos correspondientes que indiquen
      el nivel de seguridad de la información contenida de mayor calificación.
