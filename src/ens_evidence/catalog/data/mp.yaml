- id: mp.s.2
  name: Protección de servicios y aplicaciones web
  group: mp
  subgroup: mp.s
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs:
  - /datos/imagenes/disp/2022/106/7191_11542165_3.png
  - /datos/imagenes/disp/2022/106/7191_11542165_4.png
  base:
  - id: null
    label: null
    text: 'Los sistemas que prestan servicios web deberán ser protegidos frente a las siguientes amenazas:'
  - id: mp.s.2.1
    label: null
    text: 'Cuando la información requiera control de acceso se garantizará la imposibilidad de acceder
      a la información obviando la autenticación, en particular, tomando medidas en los siguientes aspectos:

      a) Se evitará que el servidor ofrezca acceso a los documentos por vías alternativas al protocolo
      determinado.

      b) Se prevendrán ataques de manipulación del localizador uniforme de recursos (Uniform Resource
      Locator, URL).

      c) Se prevendrán ataques de manipulación de fragmentos de información que se almacena en el disco
      duro del visitante de una página web a través de su navegador, a petición del servidor de la página,
      conocido en terminología inglesa como cookies.

      d) Se prevendrán ataques de inyección de código.'
  - id: mp.s.2.2
    label: null
    text: Se prevendrán intentos de escalado de privilegios.
  - id: mp.s.2.3
    label: null
    text: Se prevendrán ataques de cross site scripting.
  reinforcements:
  - id: R1
    title: Auditorías de seguridad
    required_at: []
    alternative_at:
    - BASICA
    - MEDIA
    clauses:
    - id: mp.s.2.r1.1
      label: null
      text: Se realizarán auditorías continuas de seguridad de «caja negra» sobre las aplicaciones web
        durante la fase de desarrollo y antes de la fase de producción.
    - id: mp.s.2.r1.2
      label: null
      text: La frecuencia de estas auditorías de seguridad quedará definida en el procedimiento de auditoría.
  - id: R2
    title: Auditorías de seguridad avanzada
    required_at:
    - ALTA
    alternative_at:
    - BASICA
    - MEDIA
    clauses:
    - id: mp.s.2.r2.1
      label: null
      text: Se realizarán auditorías de seguridad de «caja blanca» sobre las aplicaciones web durante
        la fase de desarrollo.
    - id: mp.s.2.r2.2
      label: null
      text: Se emplearán metodologías definidas y herramientas automáticas de detección de vulnerabilidades
        en la realización de las auditorías de seguridad sobre las aplicaciones web.
    - id: mp.s.2.r2.3
      label: null
      text: Una vez finalizada una auditoría de seguridad, se analizarán los resultados y se solventarán
        las vulnerabilidades encontradas mediante los procedimientos definidos [op.exp.5].
  - id: R3
    title: Protección de las cachés
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.s.2.r3.1
      label: null
      text: Se prevendrán ataques de manipulación de programas o dispositivos que realizan una acción
        en representación de otros, conocidos en terminología inglesa como "proxies" y, sistemas especiales
        de almacenamiento de alta velocidad, conocidos en terminología inglesa como "cachés".
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of:
      - - R1
        - R2
      expression: +[R1oR2]
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of:
      - - R1
        - R2
      expression: +[R1oR2]
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R2
      - R3
      any_of: []
      expression: +R2+R3
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.8.2
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.s.3
  name: Protección de la navegación web
  group: mp
  subgroup: mp.s
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'El acceso de los usuarios internos a la navegación por internet se protegerá frente a las amenazas
      que le son propias, actuando del siguiente modo:'
  - id: mp.s.3.1
    label: null
    text: Se establecerá una normativa de utilización, definiendo el uso que se autoriza y las limitaciones
      de uso personal. En particular, se concretará el uso permitido de conexiones cifradas.
  - id: mp.s.3.2
    label: null
    text: Se llevarán a cabo regularmente actividades de concienciación sobre higiene en la navegación
      web, fomentando el uso seguro y alertando de usos incorrectos.
  - id: mp.s.3.3
    label: null
    text: Se formará al personal encargado de la administración del sistema en monitorización del servicio
      y respuesta a incidentes.
  - id: mp.s.3.4
    label: null
    text: Se protegerá la información de resolución de direcciones web y de establecimiento de conexiones.
  - id: mp.s.3.5
    label: null
    text: Se protegerá a la organización en general y al puesto de trabajo en particular frente a problemas
      que se materializan vía navegación web.
  - id: mp.s.3.6
    label: null
    text: Se protegerá contra la actuación de programas dañinos tales como páginas activas, descargas
      de código ejecutable, etc., previniendo la exposición del sistema a vectores de ataque del tipo
      spyware, ransomware, etc.
  - id: mp.s.3.7
    label: null
    text: Se establecerá una política ejecutiva de control de cookies, en particular, para evitar la contaminación
      entre uso personal y uso organizativo.
  reinforcements:
  - id: R1
    title: Monitorización
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.s.3.r1.1
      label: null
      text: Se registrará el uso de la navegación web, estableciendo los elementos que se registran, el
        periodo de retención de estos registros y el uso que el organismo prevé hacer de ellos.
    - id: mp.s.3.r1.2
      label: null
      text: Se establecerá una función para la ruptura de canales cifrados a fin de inspeccionar su contenido,
        indicando qué se analiza, qué se registra, durante cuánto tiempo se retienen los registros y qué
        uso prevé hacer el organismo de estas inspecciones. Todo ello sin perjuicio de que se puedan autorizar
        accesos cifrados singulares a destinos de confianza.
    - id: mp.s.3.r1.3
      label: null
      text: Se establecerá una lista negra de destinos vetados.
  - id: R2
    title: Destinos autorizados
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.s.3.r2.1
      label: null
      text: Se establecerá una lista blanca de destinos accesibles. Todo acceso fuera de los lugares señalados
        en la lista blanca estará vetado, salvo autorización singular expresa.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.8.3
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.s.4
  name: Protección frente a la denegación de servicio
  group: mp
  subgroup: mp.s
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se establecerán medidas preventivas frente a ataques de denegación de servicio y denegación
      de servicio distribuido (Denial of Service, DoS y Distributed Denial of Service, DDoS). Para ello:'
  - id: mp.s.4.1
    label: mp.s 4.1
    text: Se planificará y dotará al sistema de capacidad suficiente para atender con holgura a la carga
      prevista.
  - id: mp.s.4.2
    label: null
    text: Se desplegarán tecnologías para prevenir los ataques conocidos.
  reinforcements:
  - id: R1
    title: Detección y reacción
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.s.4.r1.1
      label: null
      text: Se establecerá un sistema de detección y tratamiento de ataques de denegación de servicio
        (DoS y DDoS).
    - id: mp.s.4.r1.2
      label: mp.s. 4.r1.2
      text: Se establecerán procedimientos de reacción a los ataques, incluyendo la comunicación con el
        proveedor de comunicaciones.
  - id: R2
    title: Ataques propios
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.s.4.r2.1
      label: null
      text: Se detectará y se evitará el lanzamiento de ataques desde las propias instalaciones perjudicando
        a terceros.
  levels:
    BAJO:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes:
  - La tabla resumen del anexo titula la medida «Protección frente a denegación de servicio».
  source:
