      text: La política de seguridad de la organización definirá marcas de agua para asegurar el uso adecuado
        de la información que se maneja.
    - id: mp.si.1.r1.2
      label: null
      text: Los soportes de información digital (documentos electrónicos, material multimedia, etc.) podrán
        incluir una marca de agua según la política de seguridad.
    - id: mp.si.1.r1.3
      label: null
      text: Los equipos o dispositivos a través de los que se accede a aplicaciones, escritorios remotos
        o virtuales, datos, etc., presentarán una marca de agua en pantalla según la política de seguridad.
