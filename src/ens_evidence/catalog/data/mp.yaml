- id: mp.info.5
  name: Limpieza de documentos
  group: mp
  subgroup: mp.info
  applies_by: dimension
  dimensions:
  - C
  preamble: []
  diagram_refs: []
  base:
  - id: mp.info.5.1
    label: null
    text: En el proceso de limpieza de documentos, se retirará de estos toda la información adicional
      contenida en campos ocultos, metadatos, comentarios o revisiones anteriores, salvo cuando dicha
      información sea pertinente para el receptor del documento.
  - id: null
    label: null
    text: Esta medida es especialmente relevante cuando el documento se difunde ampliamente, como ocurre
      cuando se ofrece al público en un servidor web u otro tipo de repositorio de información.
