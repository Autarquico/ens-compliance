- id: mp.info.1
  name: Datos personales
  group: mp
  subgroup: mp.info
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.info.1.1
    label: null
    text: Cuando el sistema trate datos personales, el responsable de seguridad recogerá los requisitos
      de protección de datos que sean fijados por el responsable o por el encargado del tratamiento, contando
      con el asesoramiento del DPD, y que sean necesarios implementar en los sistemas de acuerdo a la
      naturaleza, alcance, contexto y fines del mismo, así como de los riesgos para los derechos y libertades
      de acuerdo a lo establecido en los artículos 24 y 32 del RGPD, y de acuerdo a la evaluación de impacto
      en la protección de datos, si se ha llevado a cabo.
