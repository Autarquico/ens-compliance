- id: mp.si.5
  name: Borrado y destrucción
  group: mp
  subgroup: mp.si
  applies_by: dimension
  dimensions:
  - C
  preamble:
  - La medida de borrado y destrucción de soportes de información se aplicará a todo tipo de equipos y
    soportes susceptibles de almacenar información, incluyendo medios electrónicos y no electrónicos.
  diagram_refs: []
  base:
  - id: mp.si.5.1
    label: null
    text: Los soportes que vayan a ser reutilizados para otra información o liberados a otra organización
      serán objeto del borrado seguro de su contenido que no permita su recuperación. Cuando la naturaleza
      del soporte no permita un borrado seguro, el soporte no podrá ser reutilizado en ningún otro sistema.
  - id: null
    label: null
    text: Las guías CCN-STIC del CCN precisarán los criterios para definir como seguro un mecanismo de
      borrado o de destrucción, en función de la sensibilidad de la información almacenada en el dispositivo.
  reinforcements:
  - id: R1
    title: Productos certificados
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.si.5.r1.1
      label: null
      text: Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].
  - id: R2
    title: Destrucción de soportes
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.si.5.r2.1
      label: null
      text: Una vez finalizado el ciclo de vida del soporte de información, deberá ser destruido de forma
        segura conforme a los criterios establecidos por el CCN.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.5.5
