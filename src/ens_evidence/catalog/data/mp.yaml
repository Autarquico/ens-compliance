  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.if.1.1
    label: null
    text: El equipamiento del Centro de Proceso de Datos (CPD) se instalará, en la medida de lo posible,
      en áreas separadas, específicas para su función.
  - id: mp.if.1.2
