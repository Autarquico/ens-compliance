- id: mp.if.4
  name: Energía eléctrica
  group: mp
  subgroup: mp.if
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.if.4.1
    label: null
    text: Los locales donde se ubiquen los sistemas de información y sus componentes esenciales dispondrán
      de tomas de energía eléctrica, de modo que se garantice el suministro y el correcto funcionamiento
      de las luces de emergencia.
  reinforcements:
  - id: R1
    title: Suministro eléctrico de emergencia
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.if.4.r1.1
      label: null
      text: En caso de fallo del suministro principal, el abastecimiento eléctrico deberá estar garantizado
        durante el tiempo suficiente para una terminación ordenada de los procesos y la salvaguarda de
        la información.
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
