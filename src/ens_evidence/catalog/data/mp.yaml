- id: mp.info.2
  name: Calificación de la información
  group: mp
  subgroup: mp.info
  applies_by: dimension
  dimensions:
  - C
  preamble: []
  diagram_refs: []
  base:
  - id: mp.info.2.1
    label: null
    text: Para calificar la información se estará a lo establecido legalmente por las leyes y tratados
      internacionales de los que España es miembro y su normativa de aplicación cuando se trate de materias
      clasificadas. El valor a emplear en el caso de información de materias no clasificadas sería USO
      OFICIAL para información con algún tipo de restricción en su manejo por su sensibilidad y confidencialidad.
  - id: mp.info.2.2
    label: null
    text: La política de seguridad establecerá quién es el responsable de cada información manejada por
      el sistema.
  - id: mp.info.2.3
    label: null
    text: La política de seguridad recogerá, directa o indirectamente, los criterios que, en cada organización,
      determinarán el nivel de seguridad requerido, dentro del marco establecido en el artículo 40 y los
      criterios generales señalados en el anexo I.
  - id: mp.info.2.4
    label: null
    text: El responsable de cada información seguirá los criterios determinados en el apartado anterior
      para asignar a cada información el nivel de seguridad requerido, y será responsable de su documentación
      y aprobación formal.
  - id: mp.info.2.5
    label: null
    text: El responsable de cada información en cada momento tendrá en exclusiva la potestad de modificar
      el nivel de seguridad requerido, de acuerdo a los apartados anteriores.
  reinforcements: []
  levels:
    BAJO:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.7.2
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.info.3
  name: Firma electrónica
  group: mp
  subgroup: mp.info
  applies_by: dimension
  dimensions:
  - I
  - A
  preamble: []
  diagram_refs: []
  base:
  - id: mp.info.3.1
    label: null
    text: Se empleará cualquier tipo de firma electrónica de los previstos en el vigente ordenamiento
      jurídico, entre ellos, los sistemas de código seguro de verificación vinculados a la Administración
      Pública, órgano, organismo público o entidad de derecho público, en los términos y condiciones establecidos
      en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones
      Públicas, y en la Ley 40/2015, de 1 de octubre.
  reinforcements:
  - id: R1
    title: Certificados cualificados
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.3.r1.1
      label: null
      text: Cuando se empleen sistemas de firma electrónica avanzada basados en certificados, estos serán
        cualificados.
  - id: R2
    title: Algoritmos y parámetros autorizados
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.3.r2.1
      label: null
      text: Se emplearán algoritmos y parámetros autorizados por el CCN o por un esquema nacional o europeo
        que resulte de aplicación.
    - id: null
      label: null
      text: El CCN determinará los algoritmos criptográficos que hayan sido autorizados nominalmente para
        su uso en el Esquema Nacional de Seguridad conforme a la Instrucción Técnica de Seguridad Criptología
        de empleo en el ENS.
  - id: R3
    title: Verificación y validación de firma
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.3.r3.1
      label: null
      text: Cuando proceda, se garantizará la verificación y validación de la firma electrónica durante
        el tiempo requerido por la actividad administrativa que aquélla soporte, sin perjuicio de que
        se pueda ampliar este período de acuerdo con lo que establezca la Política de Firma Electrónica
        y de Certificados que sea de aplicación. Para tal fin se adjuntará a la firma, o se referenciará,
        toda la información pertinente para su verificación y validación, incluyendo certificados o datos
        de verificación y validación.
  - id: R4
    title: Firma electrónica avanzada basada en certificados cualificados
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.3.r4.1
      label: null
      text: Se usará firma electrónica avanzada basada en certificados cualificados complementada por
        un segundo factor del tipo «algo que se sabe» o «algo que se es».
  - id: R5
    title: Firma electrónica cualificada
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.info.3.r5.1
      label: null
      text: Se usará firma electrónica cualificada, empleando productos certificados conforme a lo establecido
        en [op.pl.5].
  levels:
    BAJO:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIO:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      any_of: []
      expression: +R1+R2+R3
    ALTO:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      - R4
      any_of: []
      expression: + R1+R2+R3+R4
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.7.3
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.info.4
  name: Sellos de tiempo
  group: mp
  subgroup: mp.info
  applies_by: dimension
  dimensions:
  - T
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'La utilización de sellos de tiempo exigirá adoptar las siguientes cautelas:'
  - id: mp.info.4.1
    label: null
    text: Los sellos de tiempo se aplicarán a aquella información que sea susceptible de ser utilizada
      como evidencia electrónica en el futuro.
  - id: mp.info.4.2
    label: null
    text: Los datos pertinentes para la verificación posterior de la fecha serán tratados con la misma
      seguridad que la información fechada a efectos de disponibilidad, integridad y confidencialidad.
  - id: mp.info.4.3
    label: null
    text: Se renovarán regularmente los sellos de tiempo hasta que la información protegida ya no sea
      requerida por el proceso administrativo al que da soporte, en su caso.
  - id: mp.info.4.4
    label: null
    text: Se emplearán "sellos cualificados de tiempo electrónicos" atendiendo a lo dispuesto en el Reglamento
      (UE) n.º 910/2014 y normativa de desarrollo.
  reinforcements:
  - id: R1
    title: Productos certificados
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.info.4.r1.1
      label: mp.info.4.r1.1.
      text: Se utilizarán productos certificados según [op.pl.5].
    - id: mp.info.4.r1.2
      label: null
      text: Se asignará una fecha y hora a un documento electrónico, conforme a lo establecido en la guía
        CCN-STIC Criptología de empleo en el ENS.
