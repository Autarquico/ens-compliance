  - El responsable del sistema garantizará que los dispositivos permanecen bajo control y que satisfacen
    sus requisitos de seguridad mientras están siendo desplazados de un lugar a otro, fuera de las zonas
    controladas por la organización.
  diagram_refs: []
  base:
  - id: mp.si.4.1
    label: null
    text: Se dispondrá de un registro de entrada/salida que identifique al transportista que entrega/recibe
      el soporte.
  - id: mp.si.4.2
    label: null
    text: Se dispondrá de un procedimiento rutinario que coteje las salidas con las llegadas y levante
      las alarmas pertinentes cuando se detecte algún incidente.
  - id: mp.si.4.3
    label: null
    text: Se utilizarán los medios de protección criptográfica ([mp.si.2]) correspondientes al mayor nivel
      de seguridad de la información contenida.
  - id: mp.si.4.4
    label: null
    text: Se gestionarán las claves según [op.exp.10].
  reinforcements: []
  levels:
