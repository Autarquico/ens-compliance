- id: mp.info.6
  name: Copias de seguridad
  group: mp
  subgroup: mp.info
  applies_by: dimension
  dimensions:
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.info.6.1
    label: null
    text: Se realizarán copias de seguridad que permitan recuperar datos perdidos, accidental o intencionadamente.
      La periodicidad y los plazos de retención de estas copias de seguridad se determinarán en la normativa
      interna de la organización relativa a copias de seguridad.
  - id: mp.info.6.2
    label: null
    text: 'Los procedimientos de respaldo establecidos indicarán:

      a) Frecuencia de las copias.

      b) Requisitos de almacenamiento en el propio lugar.

      c) Requisitos de almacenamiento en otros lugares.

      d) Controles para el acceso autorizado a las copias de respaldo.'
  reinforcements:
  - id: R1
    title: Pruebas de recuperación
    required_at:
    - MEDIO
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.6.r1.1
      label: null
      text: Los procedimientos de copia de seguridad y restauración deben probarse regularmente. Su frecuencia
        dependerá de la criticidad de los datos y del impacto que cause la falta de disponibilidad.
  - id: R2
    title: Protección de las copias de seguridad
    required_at:
    - ALTO
    alternative_at: []
    clauses:
    - id: mp.info.6.r2.1
      label: null
      text: Al menos, una de las copias de seguridad se almacenará de forma separada en lugar diferente,
        de tal manera que un incidente no pueda afectar tanto al repositorio original como a la copia
        simultáneamente.
