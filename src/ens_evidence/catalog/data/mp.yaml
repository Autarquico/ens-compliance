- id: mp.com.4
  name: Separación de flujos de información en la red
  group: mp
  subgroup: mp.com
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble:
  - La segmentación acota el acceso a la información y, consiguientemente, la propagación de los incidentes
    de seguridad, que quedan restringidos al entorno donde ocurren.
  - Cuando la transmisión de información por la red se restringe a ciertos segmentos, se acota el acceso
    a la información y los incidentes de seguridad quedan encapsulados en su segmento.
  diagram_refs:
  - /datos/imagenes/disp/2022/106/7191_11542165_1.png
  - /datos/imagenes/disp/2022/106/7191_11542165_2.png
  base:
  - id: null
    label: null
    text: 'Los flujos de información se separarán en segmentos de forma que:'
  - id: mp.com.4.1
    label: null
    text: El tráfico por la red se segregará para que cada equipo solamente tenga acceso a la información
      que necesita.
  - id: mp.com.4.2
    label: null
    text: Si se emplean comunicaciones inalámbricas, será en un segmento separado.
  reinforcements:
  - id: R1
    title: Segmentación lógica básica
    required_at: []
    alternative_at:
    - MEDIA
    clauses:
    - id: mp.com.4.r1.1
      label: null
      text: Los segmentos de red se implementarán por medio de redes de área local virtuales (Virtual
        Local Area Network, VLAN).
    - id: mp.com.4.r1.2
      label: null
      text: 'La red que conforma el sistema deberá segregarse en distintas subredes contemplando como
        mínimo:

        • Usuarios.

        • Servicios.

        • Administración.'
  - id: R2
    title: Segmentación lógica avanzada
    required_at: []
    alternative_at:
    - MEDIA
    - ALTA
    clauses:
    - id: mp.com.4.r2.1
      label: null
      text: Los segmentos de red se implementarán por medio de redes privadas virtuales (Virtual Private
        Network, VPN).
  - id: R3
    title: Segmentación física
    required_at: []
    alternative_at:
    - MEDIA
    - ALTA
    clauses:
    - id: mp.com.4.r3.1
      label: null
      text: Los segmentos de red se implementarán con medios físicos separados.
  - id: R4
    title: Puntos de interconexión
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.com.4.r4.1
      label: null
      text: Control de entrada de los usuarios que llegan a cada segmento y control de entrada y salida
        de la información disponible en cada segmento.
    - id: mp.com.4.r4.2
      label: null
      text: El punto de interconexión estará particularmente asegurado, mantenido y monitorizado, (como
        en [mp.com.1]).
  levels:
    BASICA:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of:
      - - R1
        - R2
        - R3
      expression: +[R1oR2oR3]
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R4
      any_of:
      - - R2
        - R3
      expression: +[R2oR3]+R4
  notes: []
