- id: mp.sw.1
  name: Desarrollo de aplicaciones
  group: mp
  subgroup: mp.sw
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.sw.1.1
    label: null
    text: El desarrollo de aplicaciones se realizará sobre un sistema diferente y separado del de producción,
      no debiendo existir herramientas o datos de desarrollo en el entorno de producción, ni datos de
      producción en el de desarrollo.
  reinforcements:
  - id: R1
    title: Mínimo privilegio
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.sw.1.r1.1
      label: null
      text: Las aplicaciones se desarrollarán respetando el principio de mínimo privilegio, accediendo
        únicamente a los recursos imprescindibles para su función, y con los privilegios que sean indispensables.
  - id: R2
    title: Metodología de desarrollo seguro
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.sw.1.r2.1
      label: null
      text: 'Se aplicará una metodología de desarrollo seguro reconocida que:

        a) Tendrá en consideración los aspectos de seguridad a lo largo de todo el ciclo de vida.

        b) Incluirá normas de programación segura, especialmente: control de asignación y liberación de
        memoria, desbordamiento de memoria (overflow).

        c) Tratará específicamente los datos usados en pruebas.

        d) Permitirá la inspección del código fuente.'
  - id: R3
    title: Seguridad desde el diseño
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.sw.1.r3.1
      label: null
      text: 'Los siguientes elementos serán parte integral del diseño del sistema:

        a) Los mecanismos de identificación y autenticación.

        b) Los mecanismos de protección de la información tratada.

        c) La generación y tratamiento de pistas de auditoría.'
  - id: R4
    title: Datos de pruebas
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.sw.1.r4.1
      label: null
      text: Preferiblemente, las pruebas previas a la implantación o modificación de los sistemas de información
        no se realizarán con datos reales. En caso de que fuese necesario recurrir a datos reales se garantizará
        el nivel de seguridad correspondiente.
  - id: R5
    title: Lista de componentes software
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.sw.1.r5.1
      label: null
      text: El desarrollador elaborará y mantendrá actualizada una relación formal de los componentes
        software de terceros empleados en la aplicación o producto. Se mantendrá un histórico de los componentes
        utilizados en las diferentes versiones del software. El contenido mínimo de la lista de componentes,
        que contendrá, al menos, la identificación del componente, el fabricante y la versión empleada,
        se concretará en una guía CCN-STIC del CCN.
  levels:
    BASICA:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      - R4
      any_of: []
      expression: +R1+R2+R3+R4
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      - R2
      - R3
      - R4
      any_of: []
      expression: +R1+R2+R3+R4
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.6.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.sw.2
  name: Aceptación y puesta en servicio
  group: mp
  subgroup: mp.sw
  applies_by: category
  dimensions:
