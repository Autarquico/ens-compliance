- id: mp.eq.3
  name: Protección de dispositivos portátiles
  group: mp
  subgroup: mp.eq
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: Los equipos (ordenadores portátiles, tabletas, etc.) que sean susceptibles de salir de las instalaciones
      de la organización y no puedan beneficiarse de la protección física correspondiente, con un riesgo
      manifiesto de pérdida o robo, serán protegidos adecuadamente.
  - id: null
    label: null
    text: 'Sin perjuicio de las medidas generales que les afecten, se adoptarán las siguientes:'
  - id: mp.eq.3.1
    label: null
    text: Se llevará un inventario de dispositivos portátiles junto con una identificación de la persona
      responsable de cada uno de ellos y un control regular de que está positivamente bajo su control.
  - id: mp.eq.3.2
    label: null
    text: Se establecerá un procedimiento operativo de seguridad para informar al servicio de gestión
      de incidentes de pérdidas o sustracciones.
  - id: mp.eq.3.3
    label: null
    text: Cuando un dispositivo portátil se conecte remotamente a través de redes que no están bajo el
      estricto control de la organización, el ámbito de operación del servidor limitará la información
      y los servicios accesibles a los mínimos imprescindibles, requiriendo autorización previa de los
      responsables de la información y los servicios afectados. Este punto es de aplicación a conexiones
      a través de internet y otras redes que no sean de confianza.
  - id: mp.eq.3.4
    label: null
    text: Se evitará, en la medida de lo posible, que el dispositivo portátil contenga claves de acceso
      remoto a la organización que no sean imprescindibles. Se considerarán claves de acceso remoto aquellas
      que sean capaces de habilitar un acceso a otros equipos de la organización u otras de naturaleza
      análoga.
  reinforcements:
  - id: R1
    title: Cifrado del disco
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.eq.3.r1.1
      label: null
      text: Se protegerá el dispositivo portátil mediante cifrado del disco duro cuando el nivel de confidencialidad
        de la información almacenada en el mismo sea de nivel MEDIO.
  - id: R2
    title: Entornos protegidos
    required_at:
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.eq.3.r2.1
      label: null
      text: El uso de dispositivos portátiles fuera de las instalaciones de la organización se restringirá
        a entornos protegidos, donde el acceso sea controlado y a salvo de hurtos y miradas indiscretas.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
