  diagram_refs: []
  base:
  - id: mp.com.3.1
    label: null
    text: En comunicaciones con puntos exteriores al dominio propio de seguridad, se asegurará la autenticidad
      del otro extremo del canal de comunicación antes de intercambiar información. (Ver [op.acc.5]).
  - id: mp.com.3.2
    label: null
    text: 'Se prevendrán ataques activos garantizando que al ser detectados se activarán los procedimientos
      previstos de tratamiento del incidente. Se considerarán ataques activos:

      a) La alteración de la información en tránsito.

      b) La inyección de información espuria.

      c) El secuestro de la sesión por una tercera parte.'
  - id: mp.com.3.3
    label: null
    text: Se aceptará cualquier mecanismo de identificación y autenticación de los previstos en el ordenamiento
      jurídico y en la normativa de aplicación.
