    label: null
    text: Antes de pasar a producción se comprobará el correcto funcionamiento de la aplicación.
  - id: mp.sw.2.1
    label: null
    text: 'Se comprobará que:

      a) Se cumplen los criterios de aceptación en materia de seguridad.

      b) No se deteriora la seguridad de otros componentes del servicio.'
  reinforcements:
