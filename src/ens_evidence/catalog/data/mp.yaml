      label: null
      text: Se usarán, cuando sea posible, productos o servicios que cumplan lo establecido en [op.pl.5].
  - id: R2
    title: Control de dispositivos conectados a la red
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.eq.4.r2.1
      label: null
      text: Se dispondrá de soluciones que permitan visualizar los dispositivos presentes en la red, controlar
        su conexión/desconexión a la misma y verificar su configuración de seguridad.
  levels:
