- id: mp.eq.4
  name: Otros dispositivos conectados a la red
  group: mp
  subgroup: mp.eq
  applies_by: dimension
  dimensions:
  - C
  preamble:
  - 'Esta medida afecta a todo tipo de dispositivos conectados a la red y que puedan tener en algún momento
    acceso a la información, tales como:

    a) Dispositivos multifunción: impresoras, escáneres, etc.

    b) Dispositivos multimedia: proyectores, altavoces inteligentes, etc.

    c) Dispositivos internet de las cosas, en inglés Internet of Things (IoT).

    d) Dispositivos de invitados y los personales de los propios empleados, en inglés Bring Your Own Device
    (BYOD).

    e) Otros.'
  diagram_refs: []
  base:
  - id: mp.eq.4.1
    label: null
    text: Los dispositivos presentes en el sistema deberán contar con una configuración de seguridad adecuada
      de manera que se garantice el control del flujo definido de entrada y salida de la información.
  - id: mp.eq.4.2
    label: null
    text: Los dispositivos presentes en la red que dispongan de algún tipo de almacenamiento temporal
      o permanente de información proporcionarán la funcionalidad necesaria para eliminar información
      de soportes de información. (Ver [mp.si.5]).
  reinforcements:
  - id: R1
