- id: mp.s.1
  name: Protección del correo electrónico
  group: mp
  subgroup: mp.s
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'El correo electrónico se protegerá frente a las amenazas que le son propias, actuando del siguiente
      modo:'
  - id: mp.s.1.1
    label: null
    text: La información distribuida por medio de correo electrónico se protegerá, tanto en el cuerpo
      de los mensajes como en los anexos.
  - id: mp.s.1.2
    label: null
    text: Se protegerá la información de encaminamiento de mensajes y establecimiento de conexiones.
  - id: null
    label: null
    text: 'Se protegerá a la organización frente a problemas que se materializan por medio del correo
      electrónico, en concreto:'
  - id: mp.s.1.3
    label: null
    text: Correo no solicitado, en su expresión inglesa «spam».
  - id: mp.s.1.4
    label: null
    text: Código dañino, constituidos por virus, gusanos, troyanos, espías, u otros de naturaleza análoga.
  - id: mp.s.1.5
    label: null
    text: Código móvil de tipo micro-aplicación, en su expresión inglesa «applet».
  - id: null
    label: null
    text: 'Se establecerán normas de uso del correo electrónico para el personal. (Ver [org.2]). Estas
      normas de uso contendrán:'
  - id: mp.s.1.6
    label: null
    text: Limitaciones al uso como soporte de comunicaciones privadas.
  - id: mp.s.1.7
    label: null
    text: Actividades de concienciación y formación relativas al uso del correo electrónico.
  reinforcements: []
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.8.1
