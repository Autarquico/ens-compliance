- id: mp.per.1
  name: Caracterización del puesto de trabajo
  group: mp
  subgroup: mp.per
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.per.1.1
    label: null
    text: Para cada puesto de trabajo, relacionado directamente con el manejo de información o servicios,
      se definirán las responsabilidades en materia de seguridad, que estarán basadas en el análisis de
      riesgos.
  - id: mp.per.1.2
    label: null
    text: Se definirán los requisitos que deben satisfacer las personas que vayan a ocupar el puesto de
      trabajo, en particular, en términos de confidencialidad. Dichos requisitos se tendrán en cuenta
      en la selección de la persona que vaya a ocupar el puesto, incluyendo la verificación de sus antecedentes
      laborales, formación y otras referencias, de conformidad con el ordenamiento jurídico y el respeto
      a los derechos fundamentales.
  reinforcements:
  - id: R1
    title: Habilitación Personal de Seguridad
    required_at: []
    alternative_at: []
    clauses:
    - id: mp.per.1.r1.1
      label: null
      text: Los administradores de seguridad/sistema tendrán una Habilitación Personal de Seguridad (HPS)
        otorgada por la autoridad competente, como consecuencia de los resultados del análisis de riesgos
        previo o como requisito de seguridad de un sistema específico.
  levels:
    BASICA:
      not_applicable: true
      all_of: []
      any_of: []
      expression: n.a.
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.2.1
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.per.2
  name: Deberes y obligaciones
  group: mp
  subgroup: mp.per
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se informará a cada persona que trabaje en el sistema de los deberes y responsabilidades de
      su puesto de trabajo en materia de seguridad, contemplando:'
  - id: mp.per.2.1
    label: null
    text: Las medidas disciplinarias a que haya lugar.
  - id: mp.per.2.2
    label: null
    text: Contemplando tanto el periodo durante el cual se desempeña el puesto, como las obligaciones
      en caso de término de la asignación, o traslado a otro puesto de trabajo.
  - id: mp.per.2.3
    label: null
    text: El deber de confidencialidad respecto de los datos a los que tenga acceso, tanto durante el
      periodo que esté adscrito al puesto de trabajo, como posteriormente a su terminación.
  - id: mp.per.2.4
    label: null
    text: 'En caso de personal contratado a través de un tercero:'
  - id: mp.per.2.4.1
    label: null
    text: Se establecerán los deberes y obligaciones de cada parte y del personal contratado.
  - id: mp.per.2.4.2
    label: null
    text: Se establecerá el procedimiento de resolución de incidentes relacionados con el incumplimiento
      de las obligaciones.
  reinforcements:
  - id: R1
    title: Confirmación expresa
    required_at:
    - MEDIA
    - ALTA
    alternative_at: []
    clauses:
    - id: mp.per.2.r1.1
      label: null
      text: Se ha de obtener la confirmación expresa de que los usuarios conocen las instrucciones de
        seguridad necesarias y obligatorias y su aceptación, así como los procedimientos necesarios para
        llevarlas a cabo de manera adecuada.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
    ALTA:
      not_applicable: false
      all_of:
      - base
      - R1
      any_of: []
      expression: + R1
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.2.2
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.per.3
  name: Concienciación
  group: mp
  subgroup: mp.per
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se realizarán las acciones necesarias para concienciar regularmente al personal acerca de su
      papel y responsabilidad para que la seguridad del sistema alcance los niveles exigidos. En particular,
      se recordará periódicamente:'
  - id: mp.per.3.1
    label: null
    text: La normativa de seguridad relativa al buen uso de los equipos o sistemas y las técnicas de ingeniería
      social más habituales.
  - id: mp.per.3.2
    label: null
    text: La identificación de incidentes, actividades o comportamientos sospechosos que deban ser reportados
      para su tratamiento por personal especializado.
  - id: mp.per.3.3
    label: null
    text: El procedimiento para informar sobre incidentes de seguridad, sean reales o falsas alarmas.
  reinforcements: []
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: 5.2.3
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: mp.per.4
  name: Formación
  group: mp
  subgroup: mp.per
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: mp.per.4.1
    label: null
    text: 'Se formará regularmente al personal en aquellas materias relativas a seguridad de la información
      que requiera el desempeño de sus funciones, en particular en lo relativo a:

      a) Configuración de sistemas.

      b) Detección y reacción ante incidentes.

      c) Gestión de la información en cualquier soporte en el que se encuentre. Se cubrirán al menos las
      siguientes actividades: almacenamiento, transferencia, copias, distribución y destrucción.'
  - id: null
    label: null
    text: Además, se evaluará la eficacia de las acciones formativas llevadas a cabo.
  reinforcements: []
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
