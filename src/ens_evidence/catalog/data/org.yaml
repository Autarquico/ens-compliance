- id: org.4
  name: Proceso de autorización
  group: org
  subgroup: null
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se establecerá un proceso formal de autorizaciones que cubra todos los elementos del sistema
      de información concernidos:'
  - id: org.4.1
    label: null
    text: Utilización de instalaciones, habituales y alternativas.
  - id: org.4.2
    label: null
    text: Entrada de equipos en producción, en particular, equipos que involucren criptografía.
  - id: org.4.3
    label: null
    text: Entrada de aplicaciones en producción.
  - id: org.4.4
    label: null
    text: Establecimiento de enlaces de comunicaciones con otros sistemas.
  - id: org.4.5
    label: null
    text: Utilización de medios de comunicación, habituales y alternativos.
  - id: org.4.6
    label: null
    text: Utilización de soportes de información.
  - id: org.4.7
    label: null
    text: Utilización de equipos móviles. Se entenderá por equipos móviles ordenadores portátiles, tabletas,
      teléfonos móviles u otros de naturaleza análoga.
  - id: org.4.8
    label: null
    text: Utilización de servicios de terceros, bajo contrato o convenio, concesión, encargo, etc.
