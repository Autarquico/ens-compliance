group:
  id: org
  title: Marco organizativo
  text:
  - El marco organizativo está constituido por un conjunto de medidas relacionadas con la organización
    global de la seguridad.
subgroups: []
measures:
- id: org.1
  name: Política de seguridad
  group: org
  subgroup: null
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'La política de seguridad, que se aprobará de conformidad con lo dispuesto en el artículo 12
      de este real decreto, se plasmará en un documento en el que, de forma clara, se precise, al menos,
      lo siguiente:'
  - id: org.1.1
    label: null
    text: Los objetivos o misión de la organización.
  - id: org.1.2
    label: null
    text: El marco legal y regulatorio en el que se desarrollarán las actividades.
  - id: org.1.3
    label: null
    text: Los roles o funciones de seguridad, definiendo para cada uno los deberes y responsabilidades
      del cargo, así como el procedimiento para su designación y renovación.
  - id: org.1.4
    label: null
    text: La estructura del comité o los comités para la gestión y coordinación de la seguridad, detallando
      su ámbito de responsabilidad, las personas integrantes y la relación con otros elementos de la organización.
  - id: org.1.5
    label: null
    text: Las directrices para la estructuración de la documentación de seguridad del sistema, su gestión
      y acceso.
  reinforcements: []
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: '3.1'
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: org.2
  name: Normativa de seguridad
  group: org
  subgroup: null
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se dispondrá de una serie de documentos que describan:'
  - id: org.2.1
    label: null
    text: El uso correcto de equipos, servicios e instalaciones, así como lo que se considerará uso indebido.
  - id: org.2.2
    label: null
    text: 'La responsabilidad del personal con respecto al cumplimiento o violación de la normativa: derechos,
      deberes y medidas disciplinarias de acuerdo con la legislación vigente.'
  reinforcements:
  - id: R1
    title: Documentos específicos
    required_at: []
    alternative_at: []
    clauses:
    - id: org.2.r1.1
      label: null
      text: Se dispondrá de una documentación de seguridad, desarrollada según lo reflejado en las guías
        CCN-STIC que resulten de aplicación.
  levels:
    BASICA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    MEDIA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
    ALTA:
      not_applicable: false
      all_of:
      - base
      any_of: []
      expression: aplica
  notes: []
  source:
    regulation: Real Decreto 311/2022, de 3 de mayo
    annex: II
    section: '3.2'
    url: https://www.boe.es/eli/es/rd/2022/05/03/311/con
    consolidation_date: '2024-11-06'
    snapshot_sha256: a44bd57a6503f689d03faa52e69e6aa6e060ee7cd0e43c11f4125e42a02400e1
- id: org.3
  name: Procedimientos de seguridad
  group: org
  subgroup: null
  applies_by: category
  dimensions:
  - C
  - I
  - T
  - A
  - D
  preamble: []
  diagram_refs: []
  base:
  - id: null
    label: null
    text: 'Se dispondrá de una serie de documentos que detallen de forma clara y precisa cómo operar los
      elementos del sistema de información:'
  - id: org.3.1
    label: null
    text: Cómo llevar a cabo las tareas habituales.
  - id: org.3.2
    label: null
    text: Quién debe hacer cada tarea.
  - id: org.3.3
    label: null
    text: Cómo identificar y reportar comportamientos anómalos.
  - id: org.3.4
    label: org.3.4.
    text: 'La forma en que se ha de tratar la información en consideración al nivel de seguridad que requiere,
      precisando cómo efectuar:

      a) Su control de acceso.

      b) Su almacenamiento.

      c) La realización de copias.

      d) El etiquetado de soportes.

      e) Su transmisión telemática.

      f) Cualquier otra actividad relacionada con dicha información.'
  reinforcements:
  - id: R1
    title: Validación de procedimientos
    required_at: []
    alternative_at: []
    clauses:
    - id: org.3.r1.1
      label: null
      text: Se requerirá la validación de los procedimientos de seguridad por la autoridad correspondiente.
  levels:
    BASICA:
