# Caja de v0.1 (ADR 0016). Se opera con deploy/box.sh; no hay puertos publicados.
# ENS_BOX_PROJECT solo cambia el nombre del proyecto y del volumen (pruebas aisladas).
name: ${ENS_BOX_PROJECT:-ens-box}

# Sin límite, el log de peticiones denegadas de Caddy llenaría el disco que aloja las evidencias.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  app:
    image: ens-evidence:${ENS_VERSION:?usa deploy/box.sh}
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    env_file: ${ENS_ENV_FILE:-deploy/.env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # El latido vive en el tmpfs del contenedor: una versión nueva no hereda el de la anterior
      # y solo está sana si su propio scheduler late.
      ENS_HEARTBEAT_FILE: /tmp/scheduler-heartbeat
    volumes:
      - data:/data
    networks: [backend]
    logging: *logging
    healthcheck:
      # El latido (ENS_HEARTBEAT_FILE) lo renueva el bucle del scheduler en cada vuelta y,
      # durante un ciclo, el propio ciclo entre etapas, entre conectores y en cada espera
      # (BeatingClock en scheduling/scheduler.py), siempre desde el mismo hilo: si el ciclo se
      # cuelga, el latido envejece. Lo que no late son las operaciones largas e indivisibles
      # (checks, informes, copia). Umbral: el máximo entre 15 min y el timeout por conector
      # (collect.timeout_minutes, 15 por defecto) más 5 min de margen = 1200 s. Si subes ese
      # timeout en reports/schedule.yaml, sube el umbral a timeout_minutes * 60 + 300 en la
      # línea de abajo.
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(time.time() - os.stat(os.environ['ENS_HEARTBEAT_FILE']).st_mtime >= 1200)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  agent:
    profiles: [agents]
    image: ens-evidence:${ENS_VERSION:?usa deploy/box.sh}
    command: [ens-evidence, agent, serve, --host, 0.0.0.0, --port, "8000"]
    init: true
    restart: unless-stopped
    # Solo deploy/agent.env: el servidor de agentes no recibe las credenciales de los conectores.
    env_file: ${ENS_AGENT_ENV_FILE:-deploy/agent.env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - data:/data
    networks: [agent]
    logging: *logging
    healthcheck:
      # La imagen no trae curl ni wget; /healthz solo existe para este sondeo.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    profiles: [ui]
    image: ens-evidence:${ENS_VERSION:?usa deploy/box.sh}
    command: [ens-evidence, ui, serve, --host, 0.0.0.0, --port, "8000"]
    init: true
    restart: unless-stopped
    # Solo deploy/ui.env: la interfaz no recibe las credenciales de los conectores (deploy/.env).
    env_file: ${ENS_UI_ENV_FILE:-deploy/ui.env}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - data:/data
    networks: [ui-net]
    logging: *logging
    healthcheck:
      # La imagen no trae curl ni wget; /healthz solo se sondea en 127.0.0.1; Caddy responde 403 en el host de la UI.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    # Sin certificados (auto_https off), Caddy solo guarda su autoguardado de configuración y
    # su instancia: no necesita volúmenes persistentes.
    tmpfs:
      - /tmp
      - /data:uid=65532,mode=700
      - /config:uid=65532,mode=700
    cap_drop: [ALL]
    # El binario de la imagen oficial lleva la capacidad de fichero cap_net_bind_service; sin
    # ella en el conjunto permitido, el exec falla con no-new-privileges. Escucha en :8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge, agent, ui-net, copias-net]
    environment:
      # Los nombres de host salen de deploy/ui.env y deploy/agent.env (los lee box.sh); sin ellos, `.invalid`.
      ENS_UI_HOST: ${ENS_UI_HOST:-ui.invalid}
      ENS_AGENT_HOST: ${ENS_AGENT_HOST:-agent.invalid}
      ENS_COPIAS_HOST: ${ENS_COPIAS_HOST:-copias.invalid}
    logging: *logging
    healthcheck:
      # Toda ruta da 403, así que se sondea la API de administración (solo en localhost).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backrest:
    # Kit de copias (ADR 0019, spec kit-backups). Backrest v1.14.1, variante scratch (sin shell ni
    # curl: no admite healthcheck; box.sh solo comprueba que corre). deploy/box.sh kit enable
    # copias <paquete> añade deploy/kit/copias/compose.yaml con los montajes :ro elegidos.
    profiles: [copias]
    image: ghcr.io/garethgeorge/backrest:v1.14.1-scratch@sha256:2f5accac8df1dd625c73d43feb36437dd8e9ef582f8687c53d275bcb8aca0d10
    # El volumen `data` es 0700 de 10001: con otro UID no se podría leer ni con group_add. Es el
    # mismo UID sin capacidades, con `data` montado :ro y sin compartir volúmenes de escritura.
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,mode=700
      - /cache:uid=10001,mode=700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # El restic de la imagen; sin esto Backrest intentaría descargar uno en un sistema de solo lectura.
      BACKREST_RESTIC_COMMAND: /bin/restic
    volumes:
      # backrest-config guarda las credenciales de escritura (config.json): ningún otro servicio lo monta.
      - backrest-config:/config
      - backrest-data:/data
      - data:/source/caja:ro
    networks: [copias-net, copias]
    logging: *logging

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    restart: unless-stopped
    env_file: ${ENS_TUNNEL_ENV_FILE:-deploy/tunnel.env}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      caddy:
        condition: service_healthy
    networks: [edge, tunnel]
    logging: *logging
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Salidas de red:
#   app         backend: sin entrada; salida a Internet (conectores y R2).
#   agent       agent:   interna, sin salida a Internet; solo la alcanza caddy (perfil agents).
#   ui          ui-net:  interna, sin salida a Internet; solo la alcanza caddy (perfil ui).
#   backrest    copias-net: interna, solo la alcanza caddy (perfil copias); copias: salida a Internet
#               hacia el destino S3 (Compose no filtra por destino; ver docs/runbooks/kit-copias.md).
#   caddy       edge + agent + ui-net + copias-net: todas internas, sin salida a Internet; escucha en :8080.
#   cloudflared edge + tunnel: llega a caddy:8080 y sale hacia Cloudflare.
networks:
  backend: {}
  agent:
    internal: true
  ui-net:
    internal: true
  edge:
    internal: true
  copias-net:
    internal: true
  copias: {}
  tunnel: {}

volumes:
  data:
    name: ${ENS_BOX_PROJECT:-ens-box}_data
  backrest-config:
    name: ${ENS_BOX_PROJECT:-ens-box}_backrest-config
  backrest-data:
    name: ${ENS_BOX_PROJECT:-ens-box}_backrest-data
