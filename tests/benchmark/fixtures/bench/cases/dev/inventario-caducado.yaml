format: ens-benchmark-case/1
id: inventario-caducado
partition: dev
profile: mini
kind: defective
mutations:
  - op: expire_evidence
    alias: inventario
    valid_until: "2026-09-01T00:00:00+00:00"
defects:
  - id: inventario-caducado
    layer: deterministic
    measure: op.exp.1
    target: {kind: evidence, alias: inventario}
    expected_rule: EVIDENCE_EXPIRED
    requirement:
      measure: op.exp.1
      clause: op.exp.1.1
      quote: Se mantendrá un inventario actualizado de todos los elementos del sistema
    rationale: El inventario aportado dejó de estar vigente el 1 de septiembre.
