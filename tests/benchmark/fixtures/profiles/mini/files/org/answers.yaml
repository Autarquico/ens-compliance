# Respuestas de org-docs de Asesoría Ficticia (empresa ficticia del perfil mínimo del banco).
organizacion: Asesoría Ficticia S.L., asesoría fiscal y laboral para pequeñas empresas
direccion: La gerente, Carla Muestra, administradora única de Asesoría Ficticia S.L.
firmante_direccion: Carla Muestra
mision: Llevamos la contabilidad, los impuestos y las nóminas de unas 60 pequeñas empresas y autónomos de Villaficticia.
objetivos_seguridad:
  - Que los datos fiscales y laborales de los clientes no se filtren ni se pierdan.
  - Poder presentar impuestos y nóminas en plazo aunque falle un equipo o el servicio en la nube.
  - Que cada persona de la plantilla sepa qué puede y qué no puede hacer con los sistemas.
marco_legal:
  - Reglamento General de Protección de Datos (RGPD) y Ley Orgánica 3/2018 (LOPDGDD).
  - Real Decreto 311/2022 (ENS), exigido por contrato por un cliente del sector público.
  - Contratos de encargo de tratamiento firmados con cada cliente.
riesgos_datos_personales: >-
  Tratamos DNI, domicilios, IBAN, datos de nóminas y de salud (bajas laborales) de empleados de
  nuestros clientes. Una filtración podría causar fraude con las cuentas bancarias o discriminación
  laboral, y una pérdida impediría pagar nóminas a tiempo.
resp_informacion: Carla Muestra
resp_informacion_funciones: Decide qué información de clientes se trata, quién puede acceder a ella y cuánto tiempo se conserva.
resp_servicio: Dario Ejemplo
resp_servicio_funciones: Fija los plazos y la disponibilidad que exigimos al servicio de gestión que damos a los clientes.
resp_seguridad: Ana Prueba
resp_seguridad_funciones: Decide las medidas de seguridad, revisa cada trimestre que se cumplen e informa a la gerencia de las incidencias.
resp_sistema: Bruno Ensayo
resp_sistema_funciones: Administra los equipos y la nube, aplica las medidas que decide la responsable de seguridad y supervisa la operación diaria.
designacion_procedimiento: La gerente nombra por escrito a cada responsable, se lo comunica por correo a toda la plantilla y guarda el nombramiento firmado en la carpeta Seguridad del servidor.
renovacion_procedimiento: La gerente revisa los nombramientos cada enero y los sustituye si la persona se va o cambia de puesto, con un nuevo escrito y aviso a la plantilla.
coordinacion: Los cuatro responsables se reúnen el primer lunes de cada mes y Ana Prueba redacta un acta breve que se guarda en la carpeta Seguridad.
resolucion_conflictos: Decide la gerente en un plazo de cinco días laborables y lo anota en el acta de la reunión siguiente.
comite:
  - nombre: Comité de Seguridad
    ambito: Revisión mensual de incidencias, accesos y copias de seguridad.
    integrantes: Carla Muestra, Dario Ejemplo, Ana Prueba, Bruno Ensayo
    relacion: Informa a la gerencia; Bruno Ensayo traslada sus decisiones al proveedor informático externo.
documentacion_estructura: Cinco documentos (política, designación, normativa, procedimientos y proceso de autorización), todos en la carpeta Seguridad del servidor, con versión y fecha en el nombre del fichero.
documentacion_gestion: Ana Prueba custodia los documentos, los revisa cada año o tras un cambio importante y conserva las versiones anteriores en la subcarpeta Histórico.
documentacion_acceso: Todo el personal puede leerlos desde la carpeta Seguridad; solo Ana Prueba y la gerente pueden modificarlos.
difusion_personal: Se entrega por correo a cada persona al incorporarse y tras cada cambio, y se pide respuesta de «leído»; Ana Prueba guarda esas respuestas.
servicios_externalizados: "sí"
poc_servicios:
  - servicio: Asesoría laboral y nóminas
    cliente: Ayuntamiento de Villaficticia
    poc: Ana Prueba, ana@asesoria.example
    relacion: Es la propia responsable de la seguridad de Asesoría Ficticia S.L.
personas:
  - nombre: Carla Muestra
    cargo: Gerente
    contacto: carla@asesoria.example
  - nombre: Dario Ejemplo
    cargo: Jefe de administración
    contacto: dario@asesoria.example
  - nombre: Ana Prueba
    cargo: Técnica de calidad y cumplimiento
    contacto: ana@asesoria.example
  - nombre: Bruno Ensayo
    cargo: Administrador de sistemas
    contacto: bruno@asesoria.example
relacion_seguridad_sistema: distintas y sin dependencia jerárquica
uso_equipos:
  - Los equipos de la oficina se usan solo para trabajo; no se instala ningún programa sin permiso de Bruno Ensayo.
  - Los portátiles se bloquean al levantarse de la mesa y se guardan bajo llave al terminar la jornada.
uso_servicios:
  - El correo corporativo se usa solo para trabajo y nunca para enviar datos de clientes a cuentas personales.
  - Los documentos de clientes se guardan únicamente en el servidor o en la nube contratada, no en servicios personales.
uso_instalaciones:
  - La puerta de la oficina se cierra con llave al salir y la alarma se activa por la última persona.
  - Las visitas esperan en recepción y no se quedan solas en las zonas de trabajo.
uso_indebido:
  - Compartir la contraseña con otra persona, incluso de confianza.
  - Copiar datos de clientes a un pendrive o a un servicio de almacenamiento personal.
derechos_personal:
  - Recibir formación en seguridad al incorporarse y una vez al año.
  - Consultar a Ana Prueba cualquier duda sin que suponga una sanción.
deberes_personal:
  - Comunicar de inmediato cualquier incidente o sospecha.
  - Custodiar las credenciales y cambiarlas si se sospecha que se conocen.
medidas_disciplinarias: Según el convenio colectivo de oficinas y despachos de Villaficticia y el Estatuto de los Trabajadores. La gerente califica la falta (leve, grave o muy grave) y decide la sanción tras oír a la persona afectada.
procedimientos:
  - tarea: Alta y baja de usuarios
    quien: Administrador de sistemas
    pasos: Recibe la petición firmada por el jefe de administración, crea o desactiva la cuenta y revisa permisos el mismo día.
    herramienta: Formulario interno de petición y consola de administración
    evidencia: Petición firmada y registro de cambios de la consola
  - tarea: Copia de seguridad diaria
    quien: Administrador de sistemas
    pasos: Comprueba cada mañana el informe de la copia nocturna y repite la copia si ha fallado.
    herramienta: Servicio de copias en la nube y correo de informe
    evidencia: Correo de informe archivado y anotación de incidencias
  - tarea: Actualización de equipos
    quien: Administrador de sistemas
    pasos: Aplica las actualizaciones el primer jueves de mes tras probarlas en un equipo, y reinicia los demás fuera de horario.
    herramienta: Gestor de actualizaciones del sistema operativo
    evidencia: Informe mensual de equipos actualizados
anomalias_identificacion:
  - Correos que piden contraseñas o pagos urgentes.
  - Un equipo que se ralentiza o muestra ventanas que no se han abierto.
  - Ficheros de clientes que han cambiado de nombre o han desaparecido.
anomalias_comunicacion: Se avisa por teléfono a Ana Prueba o por correo a seguridad@asesoria.example en cuanto se detecta, y como máximo el mismo día.
anomalias_registro: Ana Prueba anota fecha, persona que avisa y descripción en el registro de incidencias del servidor.
info_acceso:
  - informacion: Datos de clientes (nivel medio)
    quien: Responsable de la información
    pasos: Solo se da acceso a las carpetas de los clientes asignados a cada persona y se revisa cada trimestre.
    herramienta: Permisos de carpetas del servidor
    evidencia: Acta de revisión trimestral de accesos
info_almacenamiento:
  - informacion: Datos de clientes (nivel medio)
    quien: Administrador de sistemas
    pasos: Se guardan en el servidor con disco cifrado y nunca en el escritorio de los equipos.
    herramienta: Servidor de ficheros con cifrado de disco
    evidencia: Informe de configuración del cifrado
info_copias:
  - informacion: Datos de clientes (nivel medio)
    quien: Administrador de sistemas
    pasos: Copia nocturna a la nube y prueba de restauración de una carpeta cada trimestre.
    herramienta: Servicio de copias en la nube
    evidencia: Informe de copia y acta de la prueba de restauración
info_etiquetado:
  - informacion: Soportes con datos de clientes
    quien: Técnica de calidad y cumplimiento
    pasos: Cada soporte lleva una etiqueta con su nivel y su responsable, y se anota en el inventario.
    herramienta: Etiquetas impresas e inventario de soportes
    evidencia: Inventario de soportes actualizado
info_transmision:
  - informacion: Datos de clientes (nivel medio)
    quien: Todo el personal
    pasos: Se envían solo mediante el portal de clientes o por correo cifrado, nunca por mensajería personal.
    herramienta: Portal de clientes y correo cifrado
    evidencia: Registro del portal de clientes
info_otras:
  not_applicable: true
  reason: No hay otras actividades de tratamiento; la destrucción de papel se recoge en el procedimiento de soportes.
analisis_riesgos:
  - ambito: Servidor de ficheros, correo y portal de clientes
    quien: Responsable de la seguridad
    pasos: Cada año y tras cada cambio relevante se revisan los activos, amenazas, salvaguardas y riesgos residuales y se presenta a la gerencia.
    herramienta: Hoja del análisis de riesgos en la carpeta Seguridad
    evidencia: Análisis de riesgos fechado y acta de presentación
inventario_activos:
  - ambito: Equipos, servidor y servicios en la nube
    quien: Administrador de sistemas
    pasos: Se anota cada alta y baja de equipo o servicio con su responsable y se revisa el inventario cada semestre.
    herramienta: Hoja de inventario en el servidor
    evidencia: Inventario con fecha de última revisión
gestion_cuentas:
  - ambito: Cuentas del dominio y del correo
    quien: Administrador de sistemas
    pasos: Alta nominal a petición del jefe de área; baja el mismo día en que la persona deja la empresa o la función; las cuentas inhabilitadas se conservan un año.
    herramienta: Consola de administración del correo
    evidencia: Ticket de alta o baja
credenciales:
  - ambito: Contraseñas del personal
    quien: Administrador de sistemas
    pasos: La persona firma la normativa antes de recibir la contraseña inicial, que cambia en el primer acceso; se bloquea si se sospecha que se ha revelado.
    herramienta: Consola de administración del correo
    evidencia: Acuse de recibo firmado
actualizaciones:
  - ambito: Equipos y servidor
    quien: Administrador de sistemas
    pasos: Cada semana se revisan los avisos del fabricante, se priorizan los parches críticos y se aplican en 48 horas.
    herramienta: Consola de actualizaciones
    evidencia: Informe semanal de actualizaciones
codigo_danino:
  - ambito: Todos los equipos
    quien: Administrador de sistemas
    pasos: El antivirus analiza cada fichero externo; ante una alerta se aísla el equipo y se avisa a la responsable de la seguridad.
    herramienta: Consola del antivirus
    evidencia: Informe mensual de la consola del antivirus
registro_actividad:
  - ambito: Servidor de ficheros y correo
    quien: Administrador de sistemas
    pasos: Se registran los accesos con usuario, fecha y resultado y se conservan un año.
    herramienta: Registro de auditoría del servidor
    evidencia: Exportación mensual del registro
perimetro:
  - ambito: Cortafuegos de la oficina
    quien: Responsable del sistema
    pasos: Cada nueva regla se pide por correo, la autoriza el responsable del sistema y se anota en el registro de cambios.
    herramienta: Consola del cortafuegos
    evidencia: Registro de cambios del cortafuegos
puesta_en_produccion:
  - ambito: Aplicaciones nuevas o actualizadas
    quien: Responsable del sistema
    pasos: Antes de usarla se prueba en un equipo aparte con los criterios de seguridad y se comprueba que no afecta al resto de servicios.
    herramienta: Equipo de pruebas
    evidencia: Acta de aceptación firmada
informacion_deberes:
  - ambito: Todo el personal
    quien: Responsable de la seguridad
    pasos: Al incorporarse, al cambiar de puesto y al salir se le entregan sus deberes de seguridad, las medidas disciplinarias y el deber de confidencialidad, que sigue vigente tras la salida.
    herramienta: Correo y documento de deberes del puesto
    evidencia: Documento de deberes firmado por la persona
concienciacion:
  - ambito: Todo el personal
    quien: Responsable de la seguridad
    pasos: Cada trimestre se envía un recordatorio de la normativa de uso, los engaños por correo más habituales, qué conductas sospechosas avisar y cómo comunicar un incidente, aunque sea una falsa alarma.
    herramienta: Correo interno
    evidencia: Correo enviado y lista de destinatarios
formacion:
  - ambito: Administrador de sistemas y personal que maneja datos de clientes
    quien: Responsable de la seguridad
    pasos: Cada año se imparte una sesión sobre configuración segura, reacción ante incidentes y tratamiento de la información en cualquier soporte; al final se hace un cuestionario para evaluar su eficacia.
    herramienta: Sesión presencial y cuestionario
    evidencia: Hoja de asistencia y resultados del cuestionario
aut_instalaciones:
  - elemento: Oficina principal de Villaficticia
    quien: Gerente
    solicitud: Petición por correo a la gerente
    registro: Correo archivado en la carpeta Seguridad
aut_instalaciones_alt:
  - elemento: Teletrabajo desde domicilio
    quien: Jefe de administración
    solicitud: Petición por correo indicando persona y fechas
    registro: Autorización de teletrabajo firmada
aut_equipos:
  - elemento: Ordenadores y servidor nuevos
    quien: Responsable del sistema
    solicitud: Ficha de alta del equipo con su configuración
    registro: Inventario de equipos actualizado
aut_criptografia:
  - elemento: VPN y cifrado de discos
    quien: Responsable de la seguridad
    solicitud: Petición razonada por escrito
    registro: Registro de configuración criptográfica
aut_aplicaciones:
  - elemento: Programas contables y servicios en la nube
    quien: Responsable del sistema
    solicitud: Petición por el formulario interno
    registro: Registro de aplicaciones autorizadas
aut_enlaces:
  - elemento: Conexión con el portal de la administración tributaria de un cliente
    quien: Responsable de la seguridad
    solicitud: Petición por escrito con la finalidad del enlace
    registro: Registro de enlaces autorizados
aut_comunicaciones:
  - elemento: Correo corporativo y videoconferencia
    quien: Responsable del sistema
    solicitud: Alta por el formulario interno
    registro: Registro de servicios autorizados
aut_comunicaciones_alt:
  not_applicable: true
  reason: No se usan medios alternativos; si el correo falla se llama por teléfono a los clientes.
aut_soportes:
  - elemento: Discos externos para copias puntuales
    quien: Responsable del sistema
    solicitud: Petición por correo indicando uso y duración
    registro: Inventario de soportes
aut_moviles:
  - elemento: Portátiles y teléfonos corporativos
    quien: Responsable del sistema
    solicitud: Petición firmada por el jefe de administración
    registro: Inventario de equipos móviles
aut_terceros:
  - elemento: Proveedor informático externo y asesoría laboral colaboradora
    quien: Gerente
    solicitud: Propuesta y contrato firmado
    registro: Contrato archivado y registro de proveedores
autoridad_procedimientos: el responsable de la seguridad
incidentes_alcance: Todos los equipos de la oficina, el servidor de ficheros, el correo corporativo y los servicios en la nube con datos de clientes. Es incidente cualquier suceso que comprometa la confidencialidad, integridad o disponibilidad de esos datos o servicios.
incidentes_deteccion:
  - Alertas del antivirus y del servicio de copias en la nube, que recibe Bruno Ensayo.
  - Revisión semanal de los registros del servidor por el administrador de sistemas.
  - Avisos del personal, de clientes o del proveedor informático externo a seguridad@asesoria.example.
incidentes_informe_eventos: Cualquier persona de la plantilla avisa por teléfono o por correo a la responsable de seguridad, que anota el evento o la debilidad en el registro de incidencias del servidor con fecha, quién avisa y descripción.
incidentes_niveles:
  - nivel: Bajo
    criterio: Sin pérdida ni exposición de datos de clientes y sin interrupción del servicio.
    escalado: La responsable de seguridad lo resuelve y lo comenta en la reunión mensual del Comité de Seguridad.
  - nivel: Alto
    criterio: Exposición o pérdida de datos de clientes, o servicio interrumpido más de una jornada.
    escalado: La responsable de seguridad avisa el mismo día a la gerente por teléfono y reúne al Comité de Seguridad.
incidentes_analisis: La responsable de seguridad dirige el análisis con el administrador de sistemas, determina el alcance y la causa, aplica la contención y da el incidente por resuelto cuando el servicio se ha restablecido y se ha comprobado que la causa está corregida.
incidentes_comunicacion: La gerente decide qué se comunica a clientes y proveedores y lo hace por correo o teléfono; la responsable de seguridad informa al personal por correo interno.
incidentes_registro: La responsable de seguridad anota en el registro de la herramienta (ens-evidence incident) el aviso inicial, los avances, las actuaciones de emergencia, los cambios en el sistema y el cierre.
incidentes_mejora: El Comité de Seguridad revisa los incidentes cerrados cada trimestre y la responsable de seguridad propone las medidas correctoras, que se anotan en el acta.
incidentes_datos_personales: La responsable de seguridad determina si el incidente afecta a datos personales y lo anota en el registro; en ese caso avisa a la gerente y a la asesoría jurídica externa para decidir qué comunicaciones exigen el RGPD y la Ley Orgánica 3/2018.
incibe_quien: La responsable de seguridad, a través del equipo de respuesta a incidentes que forman ella y el administrador de sistemas.
incibe_como: Por el canal de notificación que indique el INCIBE-CERT, con autorización previa de la gerente.
incibe_cuando: Los de nivel Alto, en cuanto se clasifican; los de nivel Bajo, al cerrarlos.
incidentes_evidencia: La responsable de seguridad decide qué evidencia se preserva y el asesor jurídico externo de la gestoría da el asesoramiento legal.
incidentes_eventos_auditables: La responsable de seguridad revisa los eventos auditables al cerrar cada incidente y deja constancia en el registro.
