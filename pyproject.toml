[project]
name = "ens-evidence"
version = "0.1.0"
description = "Prepara evidencias para el cumplimiento del ENS (RD 311/2022). No certifica."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
workspace = ["cryptography>=42"]
server = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
ui = [
    "ens-evidence[server]",
    "cryptography>=42",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
ens-evidence = "ens_evidence.cli:app"

[project.entry-points."ens_evidence.connectors"]
cloudflare = "ens_evidence.connectors.cloudflare:CloudflareConnector"
github = "ens_evidence.connectors.github:GitHubConnector"
google-workspace = "ens_evidence.connectors.google_workspace:GoogleWorkspaceConnector"
restic = "ens_evidence.connectors.restic:ResticConnector"

[dependency-groups]
dev = [
    "boto3>=1.34",
    "cryptography>=42",
    "jinja2>=3.1",
    "moto[s3]>=5",
    "pytest>=8",
    "python-multipart>=0.0.9",
    "ruff>=0.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ens_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: integración con Docker real (fuera del gate; pytest -m docker)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
