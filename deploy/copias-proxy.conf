# Proxy de salida del kit de copias (ADR 0019, spec kit-backups). Solo admite CONNECT al
# host:puerto del destino S3; `deploy/box.sh kit enable copias` genera destino.conf (sin secretos).
http_port 3128
include /etc/squid/destino.conf

acl CONNECT method CONNECT
http_access allow CONNECT destino_host destino_puerto
http_access deny all

cache deny all
pid_filename none
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
coredump_dir /tmp
pinger_enable off
max_filedescriptors 1024
cache_mem 0 MB
forwarded_for delete
shutdown_lifetime 1 seconds
